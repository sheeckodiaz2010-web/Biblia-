<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>Biblia RVR1960</title>
<meta name="description" content="Lee y estudia la Biblia Reina-Valera 1960. Guarda notas, versículos y planes de lectura. Funciona sin conexión después de instalarse.">
<meta name="application-name" content="Biblia RVR1960">
<meta name="theme-color" content="#f0e5cb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Biblia">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#f4f5f3;--fg:#1d2230;--mut:#69708a;--ac:#2b4db8;--acbg:#e3e9fb;--line:#d8dbe3;--sh:#fff;--hl:#fff3b8;--h1:#fff0a8;--h2:#cdeccb;--h3:#cfe3fb;--h4:#f9d3de;
--serif:'Literata',Georgia,serif;--sans:system-ui,-apple-system,'Segoe UI',sans-serif;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#12151f;--fg:#e6e6e0;--mut:#9aa1b8;--ac:#93abff;--acbg:#1f2744;--line:#2a3045;--sh:#1b2030;--hl:#4a4320;--h1:#4a4320;--h2:#24432a;--h3:#20395c;--h4:#5a2a3c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
nav.bar,header.top,button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--sans);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
button{font:inherit;color:inherit;cursor:pointer}
#pick{background:none;border:0;font:600 19px var(--serif);padding:6px 4px;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lf{display:flex;align-items:center;gap:6px;min-width:0}
#ver{font:600 12px var(--sans);background:var(--acbg);color:var(--ac);border:0;border-radius:999px;padding:5px 9px;white-space:nowrap}
#cfg{background:none;border:0;font-size:20px;color:var(--mut);padding:6px 8px}
main{max-width:640px;margin:0 auto;padding:18px 18px 8px}
#text,.pv{font-family:var(--rf,var(--serif));font-size:var(--rs,19px);line-height:1.75;font-weight:400}
.pv .v{margin:0 0 .5em}
.row{display:flex;gap:8px;margin-top:16px}
.row button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.row .p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
#back{display:none;background:var(--acbg);color:var(--ac);border:0;border-radius:10px;padding:7px 11px;font-weight:600}
#back.on{display:block}
.v{margin:0 0 .55em}
.v.m{border-radius:6px;padding:2px 6px;margin-left:-6px;margin-right:-6px}
.v.h1{background:var(--h1)}.v.h2{background:var(--h2)}.v.h3{background:var(--h3)}.v.h4{background:var(--h4)}
.v.h5{text-decoration:underline;text-decoration-color:var(--ac);text-decoration-thickness:2px;text-underline-offset:5px}
.v.jump{outline:2px solid var(--ac);outline-offset:3px;border-radius:6px}
.v.bm .n::before{content:'🔖 '}
button.x{background:var(--acbg);color:var(--ac);border:0;border-radius:6px;font:600 14px/1 var(--sans);padding:4px 7px;margin-left:6px;vertical-align:middle;cursor:pointer}
.sec{font:600 15px var(--sans);color:var(--ac);margin:24px 0 8px}
.rt{display:flex;gap:2px}
#gd,#pl{background:none;border:0;font-size:19px;padding:6px 7px}
.colors{display:flex;gap:10px;margin:8px 0 4px;flex-wrap:wrap}
.colors button{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
.colors .c1{background:var(--h1)}.colors .c2{background:var(--h2)}.colors .c3{background:var(--h3)}.colors .c4{background:var(--h4)}
.colors .c5{text-decoration:underline;text-decoration-color:var(--ac);text-decoration-thickness:2px;font-weight:600}
.colors button.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.act{display:block;width:100%;text-align:left;padding:13px 14px;margin-top:8px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.it{display:flex;gap:8px;align-items:flex-start;margin:10px 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.it .go{flex:1;background:none;border:0;text-align:left;padding:0}
.it b{color:var(--ac)}.it small{display:block;color:var(--mut);margin-top:2px;font-size:14px}
.rm{background:none;border:0;color:var(--mut);padding:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:6px;background:var(--h1);border:1px solid var(--line)}
.dot.h2{background:var(--h2)}.dot.h3{background:var(--h3)}.dot.h4{background:var(--h4)}.dot.h5{background:var(--ac)}
#upd{position:fixed;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top,0px));z-index:12;background:var(--ac);color:#fff;border-radius:14px;padding:10px 12px;display:none;align-items:center;gap:10px;box-shadow:0 4px 18px #0004}
#upd.on{display:flex}#upd span{flex:1;font-weight:600}
#upd button{border:0;border-radius:10px;padding:8px 12px;font-weight:600;background:#fff;color:#1d2230}
#upd #updx{background:none;color:inherit;padding:8px}
.n{font:600 12px var(--sans);color:var(--ac);background:none;border:0;padding:0 4px 0 0;vertical-align:super;cursor:pointer}
.w{cursor:pointer;border-radius:3px}
.w:active,.w.on{background:var(--acbg)}
.msg{color:var(--mut);padding:30px 0;text-align:center;font-family:var(--sans)}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
nav.bar button{flex:1;padding:13px 8px;border-radius:12px;border:1px solid var(--line);background:var(--sh)}
nav.bar #ctx{flex:1.6;background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
@media(prefers-color-scheme:dark){nav.bar #ctx,.row .p,.save,.grid button.cur,#upd{color:#0d1224}#upd{background:var(--ac)}}
#ov{position:fixed;inset:0;background:#0007;z-index:8;display:none}
#sh{position:fixed;left:0;right:0;bottom:0;z-index:9;max-height:80vh;background:var(--sh);border-radius:20px 20px 0 0;border-top:1px solid var(--line);transform:translateY(105%);transition:transform .25s;display:flex;flex-direction:column}
#sh.open{transform:none}
#ov.open{display:block}
#sh header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 6px}
#st{margin:0;font:600 18px var(--serif)}
#sx{background:none;border:0;font-size:18px;color:var(--mut);padding:6px}
#sb{overflow:auto;padding:4px 18px calc(24px + env(safe-area-inset-bottom,0px));line-height:1.55;font-size:16px}
#sb h3{font:600 15px var(--sans);margin:18px 0 4px;color:var(--ac)}
#sb p{margin:0 0 6px}
#sb ul{margin:0;padding-left:20px}
#sb li{margin:3px 0}
.ref{background:var(--acbg);color:var(--ac);border:0;border-radius:8px;padding:3px 9px;margin:2px 0;font-weight:600}
.refrow{margin:6px 0}
.refrow span{color:var(--mut);font-size:15px}
select,input{width:100%;font:inherit;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin-top:14px}
.grid button{padding:11px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.grid button.cur{background:var(--ac);color:#fff;border-color:var(--ac)}
.save{margin-top:12px;width:100%;padding:13px;border-radius:12px;border:0;background:var(--ac);color:#fff;font-weight:600}
.note{color:var(--mut);font-size:14px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media(prefers-reduced-motion:reduce){#sh{transition:none}}
.pb{height:10px;border-radius:99px;background:var(--acbg);overflow:hidden;margin:8px 0 4px}.pb i{display:block;height:100%;background:var(--ac)}
.pc{display:flex;justify-content:space-between;align-items:center}.pc.d b{opacity:.6}
.stats{display:flex;gap:8px;margin:10px 0}.stats div{flex:1;text-align:center;border:1px solid var(--line);border-radius:12px;padding:10px 4px}.stats b{display:block;font-size:20px;color:var(--ac)}.stats small{color:var(--mut)}

/* Pulido visual */
body{-webkit-font-smoothing:antialiased;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
header.top{background:var(--bg);background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
#pick{font-size:20px;letter-spacing:-.01em}
#ver{letter-spacing:.02em}
button{transition:transform .12s,background .15s,opacity .15s}
button:active{transform:scale(.96)}
main{padding-top:6px}
.ch{text-align:center;padding:18px 0 10px}
.ch small{display:block;font:600 12px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.ch h1{margin:2px 0 0;font:600 64px/1.05 var(--serif);color:var(--ac);letter-spacing:-.03em}
.ch::after{content:'';display:block;width:36px;height:3px;border-radius:3px;background:var(--acbg);margin:14px auto 6px}
#text{text-wrap:pretty}
.v{margin:0 0 .7em}
.n{font-size:11px;opacity:.85}
.sec{font:600 13px var(--sans);letter-spacing:.08em;text-transform:uppercase;margin:30px 0 10px}
nav.bar{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:8px;gap:6px;border-radius:24px;border:1px solid var(--line);background:color-mix(in srgb,var(--sh) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);box-shadow:0 8px 30px #0002}
nav.bar button{border:0;background:transparent;border-radius:16px;padding:13px 6px;font-weight:600;color:var(--mut)}
nav.bar #ctx{background:var(--ac);color:#fff;box-shadow:0 3px 10px color-mix(in srgb,var(--ac) 40%,transparent)}
#ov{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);background:#0006}
#sh{border-radius:26px 26px 0 0;border:0;box-shadow:0 -10px 40px #0004;max-height:86vh}
#sh::before{content:'';width:40px;height:5px;border-radius:5px;background:var(--line);margin:8px auto 0;flex:none}
#sh header{padding:10px 20px 4px}
.act,.it{border-radius:16px;background:var(--bg)}
.act:active{background:var(--acbg)}
select,input{border-radius:12px}
.grid button{border-radius:12px;font-weight:600}
.row button{border-radius:14px}
.vc{margin:12px 0 4px;padding:18px 18px 14px;border-radius:22px;background:linear-gradient(145deg,var(--acbg),var(--sh));border:1px solid var(--line);box-shadow:0 4px 18px #0000000d;position:relative}
.vc small{font:700 11px var(--sans);letter-spacing:.16em;color:var(--ac)}
.vc p{font:italic 400 20px/1.55 var(--serif);margin:8px 0 6px;padding-right:18px}
.vc b{font:600 14px var(--sans);color:var(--mut)}
.vc .vb{display:flex;gap:8px;margin-top:12px}
.vc .vb button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:14px}
.vc .vb .p{background:var(--ac);color:#fff;border-color:var(--ac)}
.vc #vx{position:absolute;top:8px;right:8px;background:none;border:0;color:var(--mut);padding:6px 8px;font-size:15px}
@media(prefers-color-scheme:dark){.vc .vb .p{color:#0d1224}nav.bar #ctx{color:#0d1224}}
#ver{pointer-events:none}

/* Renovación 2026.10.30 */
.netstat{font-size:10px;color:#2c9b62;padding:0 2px;white-space:nowrap}
.netstat.off{color:#d58a28}
#find{background:none;border:0;font-size:23px;color:var(--mut);padding:5px 7px}
.searchbox{display:flex;gap:8px;align-items:center;margin:10px 0}
.searchbox input{min-width:0;flex:1}
.searchbox button{border:0;border-radius:12px;background:var(--ac);color:#fff;padding:11px 14px;font-weight:650}
.searchmeta{font-size:13px;color:var(--mut);margin:8px 0}
.sresult{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:12px;margin:8px 0}
.sresult b{display:block;color:var(--ac);margin-bottom:4px}
.sresult small{display:block;color:var(--mut);line-height:1.45}
.notearea{min-height:130px;resize:vertical;line-height:1.5}
.toolsrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.toolsrow button{flex:1;min-width:120px}
.backupfile{display:none}
@media(max-width:390px){#pick{max-width:38vw;font-size:17px}.netstat{display:none}nav.bar button{font-size:13px}}


/* Biblia RVR1960 · interfaz renovada */
:root{--brand:#294bb2;--brand2:#1d367f;--gold:#c5a45b;--card:#fff;--soft:#eef1fa;--radius:22px}
:root[data-theme="light"]{--bg:#f6f5f1;--fg:#202638;--mut:#73798b;--ac:#294bb2;--acbg:#e7ebf8;--line:#e1e2e6;--sh:#fff;--card:#fff;--soft:#eef1fa;--h1:#fff0ad;--h2:#d9efd9;--h3:#dceaff;--h4:#f8dce4}
:root[data-theme="dark"]{--bg:#101522;--fg:#edf0f8;--mut:#a5aec3;--ac:#a9bcff;--acbg:#202b49;--line:#30394d;--sh:#171e2d;--card:#171e2d;--soft:#202b49;--h1:#51451f;--h2:#25452d;--h3:#243b60;--h4:#512d40}
.brand{display:flex;align-items:center;gap:7px;background:none;border:0;padding:5px 8px 5px 0;color:var(--ac);font:700 19px var(--sans);letter-spacing:-.04em}
.brand:first-letter{color:var(--gold)}
#pick[hidden],#ver[hidden],#readerView[hidden],#homeView[hidden],#readerBar[hidden]{display:none!important}
#homeView{max-width:680px;margin:0 auto;padding:14px 18px 34px}
.home-welcome{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 2px 20px}
.home-welcome small,.eyebrow{font:700 10px var(--sans);letter-spacing:.16em;color:var(--ac);text-transform:uppercase}
.home-welcome h1{font:600 clamp(28px,7vw,38px)/1.12 var(--serif);letter-spacing:-.035em;margin:8px 0 7px;max-width:440px}
.home-welcome p{margin:0;color:var(--mut);font-size:14px;line-height:1.5}
.home-emblem{flex:none;width:66px;height:66px;border-radius:22px;background:linear-gradient(145deg,var(--ac),var(--brand2));display:grid;place-items:center;color:#fff;font:400 42px Georgia,serif;box-shadow:0 10px 26px #294bb22b}
.daily-card{position:relative;overflow:hidden;padding:21px 20px 18px;border-radius:25px;background:linear-gradient(135deg,#243f96,#355bc2 68%,#647cc9);color:#fff;box-shadow:0 12px 28px #294bb226}
.daily-card:after{content:none!important;display:none!important}
.daily-card .eyebrow{color:#e7d39c;position:relative;z-index:1}
.daily-card blockquote{position:relative;z-index:1;margin:13px 0 12px;font:italic 400 clamp(21px,5vw,27px)/1.42 var(--serif);max-width:540px}
.daily-card .daily-ref{font-size:13px;color:#e7eafa;font-weight:650;position:relative;z-index:1}
.daily-actions{display:flex;gap:9px;margin-top:18px;position:relative;z-index:1}
.daily-actions button{border:1px solid #ffffff50;border-radius:12px;padding:10px 13px;color:#fff;background:#ffffff16;font-size:13px;font-weight:650}
.daily-actions .primary{background:#fff;color:#263f91;border-color:#fff}
.home-section{margin-top:25px}
.section-title{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:0 2px 11px}
.section-title h2{font:600 20px var(--serif);margin:0;letter-spacing:-.02em}
.section-title span{font-size:12px;color:var(--mut)}
.continue-card{background:var(--card);border:1px solid var(--line);border-radius:21px;padding:17px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 16px #18234b08}
.continue-icon{width:48px;height:58px;flex:none;border-radius:9px;background:var(--soft);display:grid;place-items:center;color:var(--ac);font-size:24px}
.continue-copy{flex:1;min-width:0}
.continue-copy small{font-size:10px;letter-spacing:.12em;font-weight:700;color:var(--mut)}
.continue-copy h3{margin:4px 0 3px;font:600 19px var(--serif)}
.continue-copy p{margin:0;color:var(--mut);font-size:12px}
.continue-card>button{border:0;background:var(--ac);color:#fff;border-radius:13px;padding:11px 13px;font-weight:700;font-size:13px;white-space:nowrap}
.home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.home-tool{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 13px;min-height:72px;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--fg)}
.home-tool .tool-icon{width:40px;height:40px;flex:none;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:19px;color:var(--ac)}
.home-tool b{display:block;font-size:13px}.home-tool small{display:block;color:var(--mut);font-size:11px;margin-top:3px}
.home-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.home-stat{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:14px 15px}
.home-stat strong{display:block;font:600 27px var(--serif);color:var(--ac)}
.home-stat span{font-size:11px;color:var(--mut)}
.plan-card{padding:17px;border-radius:20px;border:1px solid var(--line);background:var(--card)}
.plan-top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.plan-top b{font:600 17px var(--serif)}.plan-top span{font-size:12px;color:var(--mut)}
.plan-track{height:7px;border-radius:20px;background:var(--soft);overflow:hidden;margin:13px 0 8px}
.plan-track i{display:block;height:100%;background:var(--ac);border-radius:20px}
.plan-card p{font-size:12px;color:var(--mut);margin:0}
.plan-card button{margin-top:12px;border:0;background:var(--soft);color:var(--ac);font-weight:700;border-radius:11px;padding:10px 13px;font-size:12px}
.home-foot{text-align:center;color:var(--mut);font-size:11px;padding:22px 0 6px}
#readerView{max-width:680px;margin:0 auto;padding:0 18px 22px}
#readerBar{display:flex}
#readerBar button{font-size:12px;padding:12px 4px}
#readerBar #audio{background:var(--soft);color:var(--ac);flex:1.25}
#readerBar #audio.playing{background:var(--acbg);color:var(--ac)}
#readerBar #ctx{flex:1.35}
#sb textarea{width:100%;min-height:140px;padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--fg);font:inherit;resize:vertical}
#sb button:focus-visible,.home-tool:focus-visible,.continue-card button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@media(max-width:390px){#homeView{padding-left:14px;padding-right:14px}.home-welcome{padding-top:12px}.home-emblem{width:54px;height:54px;font-size:34px;border-radius:18px}.continue-card{gap:9px;padding:13px}.continue-card>button{padding:10px;font-size:12px}.home-tool{padding:11px 9px;gap:9px}.home-tool .tool-icon{width:35px;height:35px}.home-tool b{font-size:12px}}
@media(prefers-reduced-motion:reduce){button{transition:none}}


/* Centro de estudio bíblico · v4 */
.study-intro{padding:18px;border-radius:20px;background:linear-gradient(135deg,var(--acbg),var(--card));border:1px solid var(--line);margin-bottom:14px}
.study-intro strong{display:block;font:600 21px var(--serif);margin:0 0 5px}
.study-intro p{margin:0;color:var(--mut);font-size:13px;line-height:1.5}
.study-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0}
.study-tabs button{border:1px solid var(--line);border-radius:11px;background:var(--card);padding:10px 3px;font-size:11px;font-weight:700;color:var(--mut)}
.study-tabs button.active{background:var(--ac);border-color:var(--ac);color:#fff}
.study-item{display:block;width:100%;text-align:left;padding:14px;border:1px solid var(--line);border-radius:15px;background:var(--card);margin:8px 0;color:var(--fg)}
.study-item b{display:block;font:600 16px var(--serif);margin-bottom:4px}

async function groq(sys,user,json){
  if(!navigator.onLine)throw new Error('Sin conexión. La IA necesita internet; la lectura bíblica sigue disponible.');

  try{
    r=await fetch(new URL('api/chat',document.baseURI),{
      signal:ac.signal,method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({system:sys,user,json:!!json})
    });
  }catch(e){
    throw new Error(e.name==='AbortError'?'La IA tardó demasiado. Intenta de nuevo.':'No se pudo conectar con el servicio de IA. Revisa tu conexión.');

    try{const d=await r.json();if(d.error)detail=d.error}catch(e){}
    throw new Error(detail);
  }
  const d=await r.json();
  return d.content||'';

  return `<button class="ref" data-b="${best}" data-c="${m[1]}" data-v="${m[2]||''}" data-e="${m[3]||''}">${esc(ref)}</button>`;
}

const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('bib',1);r.onupgradeneeded=()=>r.result.createObjectStore('ch');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idbSet(map){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('ch','readwrite'),o=t.objectStore('ch');o.clear();for(const k in map)o.put(map[k],k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const r=db.transaction('ch').objectStore('ch').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbClear(){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('ch','readwrite');t.objectStore('ch').clear();t.oncomplete=res;t.onerror=()=>rej(t.error)})}
const hasImp=()=>ls.get('bib_imp')==='1'||ls.get('bib_src')==='import';
const verLabel=()=>'RVR1960';
function setVer(){$('ver').textContent=verLabel()}
let BIBLE=null,BIBLE_LOADING=null;
async function chapterVerses(b,c){
  if(!BIBLE){
    if(!BIBLE_LOADING)BIBLE_LOADING=(async()=>{
      const r=await fetch(new URL('biblia.json',document.baseURI),{cache:'default'});
      if(!r.ok)throw new Error('No se pudo cargar biblia.json (HTTP '+r.status+').');
      const data=await r.json();
      if(!Array.isArray(data)||data.length!==66)throw new Error('El archivo bíblico no tiene la estructura esperada de 66 libros.');
      if(data.some((book,i)=>!Array.isArray(book)||book.length!==B[i][2]||book.some(ch=>!Array.isArray(ch))))throw new Error('El archivo bíblico no coincide con los libros y capítulos esperados.');
      BIBLE=data;
      return data;
    })().catch(err=>{BIBLE_LOADING=null;throw err});
    await BIBLE_LOADING;
  }
  const v=BIBLE[b]&&BIBLE[b][c-1];
  if(!Array.isArray(v)||!v.length)throw new Error('Ese capítulo no está disponible en biblia.json.');
  return v;
}
function matchBook(n){
  n=norm(String(n)).replace(/\./g,'').replace(/\s+/g,' ');
  const al={'cantar de los cantares':'cantares','el cantar de los cantares':'cantares','cantares de salomon':'cantares','canticos':'cantares','hechos de los apostoles':'hechos','salmo':'salmos','apocalipsis de san juan':'apocalipsis','san juan':'juan','san mateo':'mateo','san marcos':'marcos','san lucas':'lucas'};
  if(al[n])n=al[n];
  let i=B.findIndex(b=>norm(b[0])===n);if(i<0)i=B.findIndex(b=>norm(b[1])===n);
  if(i<0){const m=n.replace(/^(san|santo|s)\s?/,'');if(m!==n){i=B.findIndex(b=>norm(b[0])===m)}}
  return i;
}
function parseBible(txt){
  txt=txt.replace(/^\uFEFF/,'');
  const M={};
  const put=(b,c,v,t)=>{if(!(b>=0&&b<66)||!(c>0)||!(v>0)||!t)return;(M[b]=M[b]||[]);(M[b][c-1]=M[b][c-1]||[])[v-1]=String(t).trim()};
  let data=null;try{data=JSON.parse(txt)}catch(e){}
  if(data){
    const flat=a=>a.forEach(x=>{const bk=x.book_id??x.book_number??x.book??x.book_name??x.bookName??x.libro;put((typeof bk==='number'||/^\d+$/.test(String(bk)))?+bk-1:matchBook(bk),+(x.chapter??x.capitulo),+(x.verse??x.versiculo),x.text??x.texto)});
    if(Array.isArray(data)){
      if(data[0]&&data[0].chapters)data.forEach((bk,i)=>{const b=data.length===66?i:matchBook(bk.name||bk.abbrev);(bk.chapters||[]).forEach((ch,ci)=>(Array.isArray(ch)?ch:Object.values(ch)).forEach((t,vi)=>put(b,ci+1,vi+1,typeof t==='string'?t:t&&t.text)))});
      else flat(data);
    }else if(Array.isArray(data.verses))flat(data.verses);
    else Object.keys(data).forEach(k=>{const b=matchBook(k),ch=data[k];(Array.isArray(ch)?ch.map((x,i)=>[i+1,x]):Object.entries(ch||{}).map(([c,x])=>[+c,x])).forEach(([c,x])=>(Array.isArray(x)?x.map((t,i)=>[i+1,t]):Object.entries(x||{}).map(([v,t])=>[+v,t])).forEach(([v,t])=>put(b,c,v,t)))});
  }else{
    txt.split(/\r?\n/).forEach(l=>{
      const m=l.match(/^\s*"?([^",\t]+?)"?[,\t]\s*(\d+)[,\t]\s*(\d+)[,\t]\s*"?(.*?)"?\s*$/)||l.match(/^\s*((?:[1-3]\s?)?[^\d\s][^\d:]*?)\s+(\d{1,3})\s*[:.]\s*(\d{1,3})\s*[-–—.)]*\s*(.+)$/);
      if(m)put(matchBook(m[1]),+m[2],+m[3],m[4]);
    });
  }
  const map={};let books=0,verses=0;
  Object.keys(M).forEach(b=>{books++;M[b].forEach((ch,ci)=>{if(ch){const arr=Array.from(ch,t=>t||'');map[b+':'+(ci+1)]=arr;verses+=arr.length}})});
  return {map,books,verses};
}

function openSearch(){
  openSheet('Buscar en la Biblia',`<p class="note">Busca palabras o frases en los 66 libros de la RVR1960. La búsqueda se realiza en el dispositivo.</p><div class="searchbox"><input id="bq" type="search" placeholder="Ej. amor, fe, perdón…" autocomplete="off"><button id="bsearch">Buscar</button></div><div id="bresults" aria-live="polite"></div>`);

async function runBibleSearch(){
  const q=$('bq').value.trim(),out=$('bresults');
  if(q.length<2){out.innerHTML='<p class="searchmeta">Escribe al menos dos caracteres.</p>';return}
  out.innerHTML='<p class="searchmeta">Buscando en toda la Biblia…</p>';
  try{
    await chapterVerses(0,1);
    const needle=norm(q),found=[];
    outer: for(let b=0;b<BIBLE.length;b++){
      for(let c=0;c<BIBLE[b].length;c++){
        const ch=BIBLE[b][c]||[];
        for(let v=0;v<ch.length;v++){
          const text=String(ch[v]||'');
          if(norm(text).includes(needle)){
            found.push({b,c:c+1,v:v+1,text});
            if(found.length>=100)break outer;
          }
        }
      }
    }
    if(!found.length){out.innerHTML='<p class="searchmeta">No se encontraron coincidencias. Prueba con otra palabra.</p>';return}
    out.innerHTML=`<p class="searchmeta">${found.length===100?'Se muestran las primeras 100 coincidencias.':found.length+' coincidencias encontradas.'}</p>`+
      found.map(x=>`<button class="sresult" data-sb="${x.b}" data-sc="${x.c}" data-sv="${x.v}"><b>${B[x.b][0]} ${x.c}:${x.v}</b><small>${esc(x.text)}</small></button>`).join('');
  }catch(e){out.innerHTML=`<p class="searchmeta">${esc(e.message||'No se pudo realizar la búsqueda.')}</p>`}
}

  }
  const payload={app:'Biblia RVR1960',format:1,createdAt:new Date().toISOString(),storage};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='respaldo-biblia-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);

  $('exportbib').onclick=exportBackup;

  $('backupfile').onchange=async e=>{
    const file=e.target.files&&e.target.files[0];if(!file)return;
    try{
      const data=JSON.parse(await file.text());
      if(data.app!=='Biblia RVR1960'||data.format!==1||!data.storage||typeof data.storage!=='object')throw new Error('El archivo no es un respaldo válido de esta aplicación.');
      if(!confirm('¿Restaurar este respaldo? Los datos existentes con las mismas claves serán reemplazados.'))return;
      Object.entries(data.storage).forEach(([k,v])=>{
        const allowed=k!=='bib_key'&&(/^bib_/.test(k)||/^(ctx:|xr2:|vr2:|w:)/.test(k));
        if(allowed&&typeof v==='string'&&k.length<200)localStorage.setItem(k,v);
      });

      location.reload();
    }catch(err){alert(err.message||'No se pudo restaurar el respaldo.')}
  };

/* Lectura en voz alta: divide capítulos largos para evitar límites del navegador. */
let speech=null,audioMode='idle',audioChunks=[],audioIndex=0,audioSession=0;
function stopAudio(){
  audioSession++;
  if('speechSynthesis' in window)window.speechSynthesis.cancel();
  speech=null;audioChunks=[];audioIndex=0;audioMode='idle';updateAudioButton();
}
function updateAudioButton(){
  const b=$('audio');if(!b)return;
  b.classList.toggle('playing',audioMode!=='idle');
  b.textContent=audioMode==='speaking'?'Ⅱ Pausar':audioMode==='paused'?'▶ Continuar':'▶ Escuchar';
  b.setAttribute('aria-label',audioMode==='speaking'?'Pausar lectura':audioMode==='paused'?'Continuar lectura':'Escuchar capítulo');
}
function speakAudioChunk(session){
  if(session!==audioSession)return;
  if(audioIndex>=audioChunks.length){audioMode='idle';speech=null;updateAudioButton();return}
  const utterance=new SpeechSynthesisUtterance(audioChunks[audioIndex]);speech=utterance;
  utterance.lang='es-MX';utterance.rate=.92;
  const voices=speechSynthesis.getVoices(),spanish=voices.find(v=>/^es(-|$)/i.test(v.lang));
  if(spanish)utterance.voice=spanish;
  utterance.onstart=()=>{if(session===audioSession){audioMode='speaking';updateAudioButton()}};
  utterance.onend=()=>{if(session===audioSession){audioIndex++;speakAudioChunk(session)}};
  utterance.onerror=()=>{if(session===audioSession){audioMode='idle';speech=null;audioChunks=[];updateAudioButton()}};
  speechSynthesis.speak(utterance);
}
function toggleAudio(){
  if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){alert('Este navegador no ofrece lectura en voz alta.');return}
  if(audioMode==='speaking'){speechSynthesis.pause();audioMode='paused';updateAudioButton();return}
  if(audioMode==='paused'){speechSynthesis.resume();audioMode='speaking';updateAudioButton();return}
  if(!verses.length){alert('Primero espera a que cargue el capítulo.');return}
  audioSession++;const session=audioSession;
  speechSynthesis.cancel();audioChunks=[];audioIndex=0;
  let chunk='';
  verses.forEach((v,i)=>{
    const part='Versículo '+(i+1)+'. '+v+' ';
    if(chunk.length+part.length>1300&&chunk){audioChunks.push(chunk);chunk=''}
    chunk+=part;
  });
  if(chunk)audioChunks.push(chunk);
  if(!audioChunks.length)return;
  audioMode='speaking';updateAudioButton();speakAudioChunk(session);
}
$('audio').onclick=toggleAudio;

/* Preparar una copia local verificable para lectura sin internet */
async function prepareOffline(){
  const btn=$('offlineBtn'),info=$('offlineInfo');
  btn.disabled=true;btn.textContent='Preparando Biblia…';
  info.textContent='Descargando y verificando el texto bíblico completo. No cierres la aplicación.';
  try{
    const url=new URL('biblia.json',document.baseURI);
    const response=await fetch(url,{cache:'reload'});
    if(!response.ok)throw new Error('No se pudo descargar biblia.json (HTTP '+response.status+').');
    const data=await response.clone().json();
    if(!Array.isArray(data)||data.length!==66||data.some((book,i)=>!Array.isArray(book)||book.length!==B[i][2]||book.some(ch=>!Array.isArray(ch)||!ch.length||ch.some(v=>typeof v!=='string'))))throw new Error('El archivo descargado no superó la verificación de los 66 libros.');
    if(!('caches' in window))throw new Error('Este navegador no permite guardar la Biblia para uso sin conexión.');
    const cache=await caches.open(CACHE_NAME);
    await cache.put(url,response.clone());
    BIBLE=data;BIBLE_LOADING=Promise.resolve(data);
    let persistent='';
    try{if(navigator.storage&&navigator.storage.persist){const ok=await navigator.storage.persist();persistent=ok?' El navegador concedió almacenamiento persistente.':' El navegador podría liberar datos locales si necesita espacio.'}}catch(e){}
    let size='';
    try{const est=await navigator.storage.estimate();if(est&&est.usage)size=' Almacenamiento utilizado: '+(est.usage/1048576).toFixed(1)+' MB.'}catch(e){}
    info.textContent='Biblia descargada, verificada y guardada en este dispositivo. Ya puedes probar el modo avión.'+persistent+size;
    btn.textContent='Biblia lista sin conexión ✓';
  }catch(e){
    info.textContent=e.message||'No se pudo preparar la lectura sin conexión.';
    btn.textContent='Intentar nuevamente';
  }finally{btn.disabled=false}
}

/* Descarga automática inicial: deja los 66 libros disponibles sin conexión. */
async function warmOfflineBible(){
  if(!('caches' in window) || !navigator.onLine) return;
  try{
    const url=new URL('biblia.json',document.baseURI);
    const cache=await caches.open(CACHE_NAME);
    if(await cache.match(url)) return;
    const response=await fetch(url,{cache:'reload'});
    if(!response.ok) return;
    const data=await response.clone().json();
    if(!Array.isArray(data)||data.length!==66||data.some((book,i)=>!Array.isArray(book)||book.length!==B[i][2]||book.some(ch=>!Array.isArray(ch)||!ch.length||ch.some(v=>typeof v!=='string')))) return;
    await cache.put(url,response.clone());
    BIBLE=data;BIBLE_LOADING=Promise.resolve(data);
    try{if(navigator.storage?.persist)await navigator.storage.persist()}catch(e){}
  }catch(e){/* Si falla la descarga automática, se puede reintentar desde Ajustes. */}
}

$('ctx').onclick=async()=>{
  const [es]=B[S.b],ref=es+' '+S.c,key='ctx:'+S.b+':'+S.c;
  openSheet('Contexto de '+ref,'<p class="note">Preparando el contexto…</p>');
  try{
    let d;const cached=ls.get(key);
    if(cached)d=JSON.parse(cached);
    else{
      const raw=await groq(SYS,`Dame el contexto de ${ref} para entenderlo mejor. Responde SOLO un JSON con estas claves: "autor" (quién escribió el libro, quién era y en qué situación vivía; si hay debate, dilo), "epoca" (cuándo y desde dónde se escribió), "destinatarios" (a quién iba dirigido y por qué lo escribió), "tema_libro" (idea central del libro y cómo encaja en la Biblia), "contexto_capitulo" (qué pasa antes y después, y qué quiere enseñar este capítulo, en 3 a 5 oraciones), "ideas" (lista de 3 a 5 ideas clave del capítulo), "costumbres" (lista de 0 a 4 costumbres, lugares o palabras de esa época que ayudan a entender el pasaje), "referencias" (lista de 4 a 6 objetos {"ref","nota"} con pasajes relacionados; "ref" con el formato "Libro cap:ver" usando exactamente estos nombres de libro: ${NAMES}; "nota" de una línea que explique la relación).`,true);

       <h3>Cuándo y dónde</h3><p>${L(d.epoca)}</p>
       <h3>A quién se lo escribió</h3><p>${L(d.destinatarios)}</p>

function openBibleTeacher(){
 const ref=B[S.b][0]+' '+S.c;
 openSheet('Maestro bíblico',`<div class="study-intro"><strong>Pregunta y estudia</strong><p>Haz preguntas sobre un pasaje, un tema o un personaje. El asistente debe distinguir entre el texto bíblico, el contexto histórico y las interpretaciones.</p></div><p class="note">La consulta requiere internet. No necesitas configurar ninguna llave. Puedes preguntar sobre ${ref} o cualquier tema bíblico.</p><textarea id="teacherQuestion" placeholder="Ej. ¿Qué significa la fe según Hebreos 11?"></textarea><button class="save" id="teacherAsk">Consultar al maestro bíblico</button><div id="teacherAnswer" class="study-answer"></div>`);
 $('teacherAsk').onclick=async()=>{
   const q=$('teacherQuestion').value.trim(),out=$('teacherAnswer'),btn=$('teacherAsk');
   if(q.length<4){out.innerHTML='<p class="note">Escribe una pregunta un poco más completa.</p>';return}
   btn.disabled=true;btn.textContent='Estudiando…';out.innerHTML='<p class="note">Preparando una respuesta con referencias bíblicas…</p>';
   try{
     const answer=await groq(SYS+' Responde con claridad y respeto. Prioriza el texto de la Biblia RVR1960, cita referencias precisas cuando puedas y explica el contexto. Distingue hechos narrados, datos históricos discutidos e interpretaciones doctrinales. No inventes citas ni afirmes que una interpretación es la única si existen diferencias entre tradiciones cristianas. Termina con 2 a 4 pasajes para seguir estudiando.',`Pregunta del usuario: ${q}\nPasaje que la app tiene abierto: ${ref}.`,false);
     out.innerHTML=`<h3>Respuesta</h3><p>${L(answer).replace(/\n/g,'<br>')}</p>`;
   }catch(e){out.innerHTML=errHtml(e)}
   finally{btn.disabled=false;btn.textContent='Consultar al maestro bíblico'}
 };
}
$('sb').addEventListener('click',e=>{
 const tab=e.target.closest('[data-study-tab]');
 const topic=e.target.closest('[data-study-topic]');
 const person=e.target.closest('[data-study-person]');
 const place=e.target.closest('[data-study-place]');
 const ref=e.target.closest('[data-study-ref]');
 if(tab){openStudyHub(tab.dataset.studyTab);return}
 if(topic){showStudyDetail('topic',topic.dataset.studyTopic);return}
 if(person){showStudyDetail('person',person.dataset.studyPerson);return}
 if(place){showStudyDetail('place',place.dataset.studyPlace);return}
 if(ref){
   const prev={t:$('st').textContent,h:$('sb').innerHTML};
   const parsed=refBtn(ref.dataset.studyRef);
   const holder=document.createElement('div');holder.innerHTML=parsed;
   const b=holder.querySelector('.ref');
   if(b){const bi=+b.dataset.b,ci=Math.min(+b.dataset.c,B[bi][2]),vi=b.dataset.v?+b.dataset.v:null;preview(bi,ci,vi,b.dataset.e?+b.dataset.e:null,prev)}
   return;
 }
});
$('sb').addEventListener('input',e=>{
 if(e.target.id==='studyFilter'){
   const val=e.target.value,tab=document.querySelector('[data-study-tab].active')?.dataset.studyTab||'temas';
   const pos=e.target.selectionStart;
   openStudyHub(tab,val);
   const input=$('studyFilter');if(input){input.focus();input.setSelectionRange(pos,pos)}
 }
});


// Arranque: inicio, y descarga de la Biblia en segundo plano para lectura offline.
showHome();
window.addEventListener('load',()=>warmOfflineBible(),{once:true});
</script>
