<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>Biblia RVR1960</title>
<meta name="description" content="Lee y estudia la Biblia Reina-Valera 1960. Guarda notas, versículos y planes de lectura. Funciona sin conexión después de instalarse.">
<meta name="application-name" content="Biblia RVR1960">
<meta name="theme-color" content="#f0e5cb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Biblia">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#f4f5f3;--fg:#1d2230;--mut:#69708a;--ac:#2b4db8;--acbg:#e3e9fb;--line:#d8dbe3;--sh:#fff;--hl:#fff3b8;--h1:#fff0a8;--h2:#cdeccb;--h3:#cfe3fb;--h4:#f9d3de;
--serif:'Literata',Georgia,serif;--sans:system-ui,-apple-system,'Segoe UI',sans-serif;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#12151f;--fg:#e6e6e0;--mut:#9aa1b8;--ac:#93abff;--acbg:#1f2744;--line:#2a3045;--sh:#1b2030;--hl:#4a4320;--h1:#4a4320;--h2:#24432a;--h3:#20395c;--h4:#5a2a3c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
nav.bar,header.top,button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--sans);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
button{font:inherit;color:inherit;cursor:pointer}
#pick{background:none;border:0;font:600 19px var(--serif);padding:6px 4px;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lf{display:flex;align-items:center;gap:6px;min-width:0}
#ver{font:600 12px var(--sans);background:var(--acbg);color:var(--ac);border:0;border-radius:999px;padding:5px 9px;white-space:nowrap}
#cfg{background:none;border:0;font-size:20px;color:var(--mut);padding:6px 8px}
main{max-width:640px;margin:0 auto;padding:18px 18px 8px}
#text,.pv{font-family:var(--rf,var(--serif));font-size:var(--rs,19px);line-height:1.75;font-weight:400}
.pv .v{margin:0 0 .5em}
.row{display:flex;gap:8px;margin-top:16px}
.row button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.row .p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
#back{display:none;background:var(--acbg);color:var(--ac);border:0;border-radius:10px;padding:7px 11px;font-weight:600}
#back.on{display:block}
.v{margin:0 0 .55em}
.v.m{border-radius:6px;padding:2px 6px;margin-left:-6px;margin-right:-6px}
.v.h1{background:var(--h1)}.v.h2{background:var(--h2)}.v.h3{background:var(--h3)}.v.h4{background:var(--h4)}
.v.h5{text-decoration:underline;text-decoration-color:var(--ac);text-decoration-thickness:2px;text-underline-offset:5px}
.v.jump{outline:2px solid var(--ac);outline-offset:3px;border-radius:6px}
.v.bm .n::before{content:'🔖 '}
button.x{background:var(--acbg);color:var(--ac);border:0;border-radius:6px;font:600 14px/1 var(--sans);padding:4px 7px;margin-left:6px;vertical-align:middle;cursor:pointer}
.sec{font:600 15px var(--sans);color:var(--ac);margin:24px 0 8px}
.rt{display:flex;gap:2px}
#gd,#pl{background:none;border:0;font-size:19px;padding:6px 7px}
.colors{display:flex;gap:10px;margin:8px 0 4px;flex-wrap:wrap}
.colors button{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
.colors .c1{background:var(--h1)}.colors .c2{background:var(--h2)}.colors .c3{background:var(--h3)}.colors .c4{background:var(--h4)}
.colors .c5{text-decoration:underline;text-decoration-color:var(--ac);text-decoration-thickness:2px;font-weight:600}
.colors button.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.act{display:block;width:100%;text-align:left;padding:13px 14px;margin-top:8px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.it{display:flex;gap:8px;align-items:flex-start;margin:10px 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.it .go{flex:1;background:none;border:0;text-align:left;padding:0}
.it b{color:var(--ac)}.it small{display:block;color:var(--mut);margin-top:2px;font-size:14px}
.rm{background:none;border:0;color:var(--mut);padding:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:6px;background:var(--h1);border:1px solid var(--line)}
.dot.h2{background:var(--h2)}.dot.h3{background:var(--h3)}.dot.h4{background:var(--h4)}.dot.h5{background:var(--ac)}
#upd{position:fixed;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top,0px));z-index:12;background:var(--ac);color:#fff;border-radius:14px;padding:10px 12px;display:none;align-items:center;gap:10px;box-shadow:0 4px 18px #0004}
#upd.on{display:flex}#upd span{flex:1;font-weight:600}
#upd button{border:0;border-radius:10px;padding:8px 12px;font-weight:600;background:#fff;color:#1d2230}
#upd #updx{background:none;color:inherit;padding:8px}
.n{font:600 12px var(--sans);color:var(--ac);background:none;border:0;padding:0 4px 0 0;vertical-align:super;cursor:pointer}
.w{cursor:pointer;border-radius:3px}
.w:active,.w.on{background:var(--acbg)}
.msg{color:var(--mut);padding:30px 0;text-align:center;font-family:var(--sans)}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
nav.bar button{flex:1;padding:13px 8px;border-radius:12px;border:1px solid var(--line);background:var(--sh)}
nav.bar #ctx{flex:1.6;background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
@media(prefers-color-scheme:dark){nav.bar #ctx,.row .p,.save,.grid button.cur,#upd{color:#0d1224}#upd{background:var(--ac)}}
#ov{position:fixed;inset:0;background:#0007;z-index:8;display:none}
#sh{position:fixed;left:0;right:0;bottom:0;z-index:9;max-height:80vh;background:var(--sh);border-radius:20px 20px 0 0;border-top:1px solid var(--line);transform:translateY(105%);transition:transform .25s;display:flex;flex-direction:column}
#sh.open{transform:none}
#ov.open{display:block}
#sh header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 6px}
#st{margin:0;font:600 18px var(--serif)}
#sx{background:none;border:0;font-size:18px;color:var(--mut);padding:6px}
#sb{overflow:auto;padding:4px 18px calc(24px + env(safe-area-inset-bottom,0px));line-height:1.55;font-size:16px}
#sb h3{font:600 15px var(--sans);margin:18px 0 4px;color:var(--ac)}
#sb p{margin:0 0 6px}
#sb ul{margin:0;padding-left:20px}
#sb li{margin:3px 0}
.ref{background:var(--acbg);color:var(--ac);border:0;border-radius:8px;padding:3px 9px;margin:2px 0;font-weight:600}
.refrow{margin:6px 0}
.refrow span{color:var(--mut);font-size:15px}
select,input{width:100%;font:inherit;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin-top:14px}
.grid button{padding:11px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.grid button.cur{background:var(--ac);color:#fff;border-color:var(--ac)}
.save{margin-top:12px;width:100%;padding:13px;border-radius:12px;border:0;background:var(--ac);color:#fff;font-weight:600}
.note{color:var(--mut);font-size:14px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media(prefers-reduced-motion:reduce){#sh{transition:none}}
.pb{height:10px;border-radius:99px;background:var(--acbg);overflow:hidden;margin:8px 0 4px}.pb i{display:block;height:100%;background:var(--ac)}
.pc{display:flex;justify-content:space-between;align-items:center}.pc.d b{opacity:.6}
.stats{display:flex;gap:8px;margin:10px 0}.stats div{flex:1;text-align:center;border:1px solid var(--line);border-radius:12px;padding:10px 4px}.stats b{display:block;font-size:20px;color:var(--ac)}.stats small{color:var(--mut)}

/* Pulido visual */
body{-webkit-font-smoothing:antialiased;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
header.top{background:var(--bg);background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
#pick{font-size:20px;letter-spacing:-.01em}
#ver{letter-spacing:.02em}
button{transition:transform .12s,background .15s,opacity .15s}
button:active{transform:scale(.96)}
main{padding-top:6px}
.ch{text-align:center;padding:18px 0 10px}
.ch small{display:block;font:600 12px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.ch h1{margin:2px 0 0;font:600 64px/1.05 var(--serif);color:var(--ac);letter-spacing:-.03em}
.ch::after{content:'';display:block;width:36px;height:3px;border-radius:3px;background:var(--acbg);margin:14px auto 6px}
#text{text-wrap:pretty}
.v{margin:0 0 .7em}
.n{font-size:11px;opacity:.85}
.sec{font:600 13px var(--sans);letter-spacing:.08em;text-transform:uppercase;margin:30px 0 10px}
nav.bar{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:8px;gap:6px;border-radius:24px;border:1px solid var(--line);background:color-mix(in srgb,var(--sh) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);box-shadow:0 8px 30px #0002}
nav.bar button{border:0;background:transparent;border-radius:16px;padding:13px 6px;font-weight:600;color:var(--mut)}
nav.bar #ctx{background:var(--ac);color:#fff;box-shadow:0 3px 10px color-mix(in srgb,var(--ac) 40%,transparent)}
#ov{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);background:#0006}
#sh{border-radius:26px 26px 0 0;border:0;box-shadow:0 -10px 40px #0004;max-height:86vh}
#sh::before{content:'';width:40px;height:5px;border-radius:5px;background:var(--line);margin:8px auto 0;flex:none}
#sh header{padding:10px 20px 4px}
.act,.it{border-radius:16px;background:var(--bg)}
.act:active{background:var(--acbg)}
select,input{border-radius:12px}
.grid button{border-radius:12px;font-weight:600}
.row button{border-radius:14px}
.vc{margin:12px 0 4px;padding:18px 18px 14px;border-radius:22px;background:linear-gradient(145deg,var(--acbg),var(--sh));border:1px solid var(--line);box-shadow:0 4px 18px #0000000d;position:relative}
.vc small{font:700 11px var(--sans);letter-spacing:.16em;color:var(--ac)}
.vc p{font:italic 400 20px/1.55 var(--serif);margin:8px 0 6px;padding-right:18px}
.vc b{font:600 14px var(--sans);color:var(--mut)}
.vc .vb{display:flex;gap:8px;margin-top:12px}
.vc .vb button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:14px}
.vc .vb .p{background:var(--ac);color:#fff;border-color:var(--ac)}
.vc #vx{position:absolute;top:8px;right:8px;background:none;border:0;color:var(--mut);padding:6px 8px;font-size:15px}
@media(prefers-color-scheme:dark){.vc .vb .p{color:#0d1224}nav.bar #ctx{color:#0d1224}}
#ver{pointer-events:none}

/* Renovación 2026.10.30 */
.netstat{font-size:10px;color:#2c9b62;padding:0 2px;white-space:nowrap}
.netstat.off{color:#d58a28}
#find{background:none;border:0;font-size:23px;color:var(--mut);padding:5px 7px}
.searchbox{display:flex;gap:8px;align-items:center;margin:10px 0}
.searchbox input{min-width:0;flex:1}
.searchbox button{border:0;border-radius:12px;background:var(--ac);color:#fff;padding:11px 14px;font-weight:650}
.searchmeta{font-size:13px;color:var(--mut);margin:8px 0}
.sresult{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:12px;margin:8px 0}
.sresult b{display:block;color:var(--ac);margin-bottom:4px}
.sresult small{display:block;color:var(--mut);line-height:1.45}
.notearea{min-height:130px;resize:vertical;line-height:1.5}
.toolsrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.toolsrow button{flex:1;min-width:120px}
.backupfile{display:none}
@media(max-width:390px){#pick{max-width:38vw;font-size:17px}.netstat{display:none}nav.bar button{font-size:13px}}


/* Biblia RVR1960 · interfaz renovada */
:root{--brand:#294bb2;--brand2:#1d367f;--gold:#c5a45b;--card:#fff;--soft:#eef1fa;--radius:22px}
:root[data-theme="light"]{--bg:#f6f5f1;--fg:#202638;--mut:#73798b;--ac:#294bb2;--acbg:#e7ebf8;--line:#e1e2e6;--sh:#fff;--card:#fff;--soft:#eef1fa;--h1:#fff0ad;--h2:#d9efd9;--h3:#dceaff;--h4:#f8dce4}
:root[data-theme="dark"]{--bg:#101522;--fg:#edf0f8;--mut:#a5aec3;--ac:#a9bcff;--acbg:#202b49;--line:#30394d;--sh:#171e2d;--card:#171e2d;--soft:#202b49;--h1:#51451f;--h2:#25452d;--h3:#243b60;--h4:#512d40}
.brand{display:flex;align-items:center;gap:7px;background:none;border:0;padding:5px 8px 5px 0;color:var(--ac);font:700 19px var(--sans);letter-spacing:-.04em}
.brand:first-letter{color:var(--gold)}
#pick[hidden],#ver[hidden],#readerView[hidden],#homeView[hidden],#readerBar[hidden]{display:none!important}
#homeView{max-width:680px;margin:0 auto;padding:14px 18px 34px}
.home-welcome{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 2px 20px}
.home-welcome small,.eyebrow{font:700 10px var(--sans);letter-spacing:.16em;color:var(--ac);text-transform:uppercase}
.home-welcome h1{font:600 clamp(28px,7vw,38px)/1.12 var(--serif);letter-spacing:-.035em;margin:8px 0 7px;max-width:440px}
.home-welcome p{margin:0;color:var(--mut);font-size:14px;line-height:1.5}
.home-emblem{flex:none;width:66px;height:66px;border-radius:22px;background:linear-gradient(145deg,var(--ac),var(--brand2));display:grid;place-items:center;color:#fff;font:400 42px Georgia,serif;box-shadow:0 10px 26px #294bb22b}
.daily-card{position:relative;overflow:hidden;padding:21px 20px 18px;border-radius:25px;background:linear-gradient(135deg,#243f96,#355bc2 68%,#647cc9);color:#fff;box-shadow:0 12px 28px #294bb226}
.daily-card:after{content:none!important;display:none!important}
.daily-card .eyebrow{color:#e7d39c;position:relative;z-index:1}
.daily-card blockquote{position:relative;z-index:1;margin:13px 0 12px;font:italic 400 clamp(21px,5vw,27px)/1.42 var(--serif);max-width:540px}
.daily-card .daily-ref{font-size:13px;color:#e7eafa;font-weight:650;position:relative;z-index:1}
.daily-actions{display:flex;gap:9px;margin-top:18px;position:relative;z-index:1}
.daily-actions button{border:1px solid #ffffff50;border-radius:12px;padding:10px 13px;color:#fff;background:#ffffff16;font-size:13px;font-weight:650}
.daily-actions .primary{background:#fff;color:#263f91;border-color:#fff}
.home-section{margin-top:25px}
.section-title{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:0 2px 11px}
.section-title h2{font:600 20px var(--serif);margin:0;letter-spacing:-.02em}
.section-title span{font-size:12px;color:var(--mut)}
.continue-card{background:var(--card);border:1px solid var(--line);border-radius:21px;padding:17px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 16px #18234b08}
.continue-icon{width:48px;height:58px;flex:none;border-radius:9px;background:var(--soft);display:grid;place-items:center;color:var(--ac);font-size:24px}
.continue-copy{flex:1;min-width:0}
.continue-copy small{font-size:10px;letter-spacing:.12em;font-weight:700;color:var(--mut)}
.continue-copy h3{margin:4px 0 3px;font:600 19px var(--serif)}
.continue-copy p{margin:0;color:var(--mut);font-size:12px}
.continue-card>button{border:0;background:var(--ac);color:#fff;border-radius:13px;padding:11px 13px;font-weight:700;font-size:13px;white-space:nowrap}
.home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.home-tool{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 13px;min-height:72px;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--fg)}
.home-tool .tool-icon{width:40px;height:40px;flex:none;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:19px;color:var(--ac)}
.home-tool b{display:block;font-size:13px}.home-tool small{display:block;color:var(--mut);font-size:11px;margin-top:3px}
.home-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.home-stat{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:14px 15px}
.home-stat strong{display:block;font:600 27px var(--serif);color:var(--ac)}
.home-stat span{font-size:11px;color:var(--mut)}
.plan-card{padding:17px;border-radius:20px;border:1px solid var(--line);background:var(--card)}
.plan-top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.plan-top b{font:600 17px var(--serif)}.plan-top span{font-size:12px;color:var(--mut)}
.plan-track{height:7px;border-radius:20px;background:var(--soft);overflow:hidden;margin:13px 0 8px}
.plan-track i{display:block;height:100%;background:var(--ac);border-radius:20px}
.plan-card p{font-size:12px;color:var(--mut);margin:0}
.plan-card button{margin-top:12px;border:0;background:var(--soft);color:var(--ac);font-weight:700;border-radius:11px;padding:10px 13px;font-size:12px}
.home-foot{text-align:center;color:var(--mut);font-size:11px;padding:22px 0 6px}
#readerView{max-width:680px;margin:0 auto;padding:0 18px 22px}
#readerBar{display:flex}
#readerBar button{font-size:12px;padding:12px 4px}
#readerBar #audio{background:var(--soft);color:var(--ac);flex:1.25}
#readerBar #audio.playing{background:var(--acbg);color:var(--ac)}
#readerBar #ctx{flex:1.35}
#sb textarea{width:100%;min-height:140px;padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--fg);font:inherit;resize:vertical}
#sb button:focus-visible,.home-tool:focus-visible,.continue-card button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@media(max-width:390px){#homeView{padding-left:14px;padding-right:14px}.home-welcome{padding-top:12px}.home-emblem{width:54px;height:54px;font-size:34px;border-radius:18px}.continue-card{gap:9px;padding:13px}.continue-card>button{padding:10px;font-size:12px}.home-tool{padding:11px 9px;gap:9px}.home-tool .tool-icon{width:35px;height:35px}.home-tool b{font-size:12px}}
@media(prefers-reduced-motion:reduce){button{transition:none}}


/* Centro de estudio bíblico · v4 */
.study-intro{padding:18px;border-radius:20px;background:linear-gradient(135deg,var(--acbg),var(--card));border:1px solid var(--line);margin-bottom:14px}
.study-intro strong{display:block;font:600 21px var(--serif);margin:0 0 5px}
.study-intro p{margin:0;color:var(--mut);font-size:13px;line-height:1.5}
.study-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0}
.study-tabs button{border:1px solid var(--line);border-radius:11px;background:var(--card);padding:10px 3px;font-size:11px;font-weight:700;color:var(--mut)}
.study-tabs button.active{background:var(--ac);border-color:var(--ac);color:#fff}
.study-item{display:block;width:100%;text-align:left;padding:14px;border:1px solid var(--line);border-radius:15px;background:var(--card);margin:8px 0;color:var(--fg)}
.study-item b{display:block;font:600 16px var(--serif);margin-bottom:4px}

/* Referencias tocables */
function refBtn(ref){
  const n=norm(ref);let best=-1,len=0;
  B.forEach((b,i)=>{const x=norm(b[0])+' ';if(n.startsWith(x)&&x.length>len){best=i;len=x.length}});
  if(best<0)return esc(ref);
  const m=n.slice(len).match(/^(\d+)(?::(\d+)(?:[-–](\d+))?)?/);
  if(!m||+m[1]<1||+m[1]>B[best][2]||(m[2]&&+m[2]<1)||(m[3]&&+m[3]<+m[2]))return esc(ref);
  if(typeof BIBLE!=='undefined'&&BIBLE&&m[2]&&(!BIBLE[best]?.[+m[1]-1]?.[+m[2]-1]||(m[3]&&!BIBLE[best]?.[+m[1]-1]?.[+m[3]-1])))return esc(ref)+' (referencia por verificar)';
  return `<button class="ref" data-b="${best}" data-c="${m[1]}" data-v="${m[2]||''}" data-e="${m[3]||''}">${esc(ref)}</button>`;
}
const RE=new RegExp('('+B.map(b=>b[0]).sort((a,b)=>b.length-a.length).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\s+\\d+(?::\\d+(?:[-–]\\d+)?)?','gi');
const L=t=>esc(t).replace(RE,(m,_n,off,str)=>/[\p{L}\d]/u.test(str[off-1]||'')?m:refBtn(m));
const clean=(l,b,c,v)=>(Array.isArray(l)?l:[]).filter(r=>r&&r.ref&&norm(String(r.ref))!==norm(B[b][0]+' '+c+':'+v));
const refList=a=>(a||[]).map(r=>`<div class="refrow">${refBtn(r.ref)} <span>${L(r.nota)}</span></div>`).join('');
let hist=[];
function upBack(){const x=hist[hist.length-1];$('back').classList.toggle('on',!!x);if(x)$('back').textContent='↩ '+B[x.b][0]+' '+x.c}

/* Texto bíblico local: Reina-Valera 1960 */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('bib',1);r.onupgradeneeded=()=>r.result.createObjectStore('ch');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idbSet(map){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('ch','readwrite'),o=t.objectStore('ch');o.clear();for(const k in map)o.put(map[k],k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const r=db.transaction('ch').objectStore('ch').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbClear(){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('ch','readwrite');t.objectStore('ch').clear();t.oncomplete=res;t.onerror=()=>rej(t.error)})}
const hasImp=()=>ls.get('bib_imp')==='1'||ls.get('bib_src')==='import';
const verLabel=()=>'RVR1960';
function setVer(){$('ver').textContent=verLabel()}
let BIBLE=null,BIBLE_LOADING=null;
async function chapterVerses(b,c){
  if(!BIBLE){
    if(!BIBLE_LOADING)BIBLE_LOADING=(async()=>{
      const r=await fetch(new URL('biblia.json',document.baseURI),{cache:'default'});
      if(!r.ok)throw new Error('No se pudo cargar biblia.json (HTTP '+r.status+').');
      const data=await r.json();
      if(!Array.isArray(data)||data.length!==66)throw new Error('El archivo bíblico no tiene la estructura esperada de 66 libros.');
      if(data.some((book,i)=>!Array.isArray(book)||book.length!==B[i][2]||book.some(ch=>!Array.isArray(ch))))throw new Error('El archivo bíblico no coincide con los libros y capítulos esperados.');
      BIBLE=data;
      return data;
    })().catch(err=>{BIBLE_LOADING=null;throw err});
    await BIBLE_LOADING;
  }
  const v=BIBLE[b]&&BIBLE[b][c-1];
  if(!Array.isArray(v)||!v.length)throw new Error('Ese capítulo no está disponible en biblia.json.');
  return v;
}
function matchBook(n){
  n=norm(String(n)).replace(/\./g,'').replace(/\s+/g,' ');
  const al={'cantar de los cantares':'cantares','el cantar de los cantares':'cantares','cantares de salomon':'cantares','canticos':'cantares','hechos de los apostoles':'hechos','salmo':'salmos','apocalipsis de san juan':'apocalipsis','san juan':'juan','san mateo':'mateo','san marcos':'marcos','san lucas':'lucas'};
  if(al[n])n=al[n];
  let i=B.findIndex(b=>norm(b[0])===n);if(i<0)i=B.findIndex(b=>norm(b[1])===n);
  if(i<0){const m=n.replace(/^(san|santo|s)\s?/,'');if(m!==n){i=B.findIndex(b=>norm(b[0])===m)}}
  return i;
}
function parseBible(txt){
  txt=txt.replace(/^\uFEFF/,'');
  const M={};
  const put=(b,c,v,t)=>{if(!(b>=0&&b<66)||!(c>0)||!(v>0)||!t)return;(M[b]=M[b]||[]);(M[b][c-1]=M[b][c-1]||[])[v-1]=String(t).trim()};
  let data=null;try{data=JSON.parse(txt)}catch(e){}
  if(data){
    const flat=a=>a.forEach(x=>{const bk=x.book_id??x.book_number??x.book??x.book_name??x.bookName??x.libro;put((typeof bk==='number'||/^\d+$/.test(String(bk)))?+bk-1:matchBook(bk),+(x.chapter??x.capitulo),+(x.verse??x.versiculo),x.text??x.texto)});
    if(Array.isArray(data)){
      if(data[0]&&data[0].chapters)data.forEach((bk,i)=>{const b=data.length===66?i:matchBook(bk.name||bk.abbrev);(bk.chapters||[]).forEach((ch,ci)=>(Array.isArray(ch)?ch:Object.values(ch)).forEach((t,vi)=>put(b,ci+1,vi+1,typeof t==='string'?t:t&&t.text)))});
      else flat(data);
    }else if(Array.isArray(data.verses))flat(data.verses);
    else Object.keys(data).forEach(k=>{const b=matchBook(k),ch=data[k];(Array.isArray(ch)?ch.map((x,i)=>[i+1,x]):Object.entries(ch||{}).map(([c,x])=>[+c,x])).forEach(([c,x])=>(Array.isArray(x)?x.map((t,i)=>[i+1,t]):Object.entries(x||{}).map(([v,t])=>[+v,t])).forEach(([v,t])=>put(b,c,v,t)))});
  }else{
    txt.split(/\r?\n/).forEach(l=>{
      const m=l.match(/^\s*"?([^",\t]+?)"?[,\t]\s*(\d+)[,\t]\s*(\d+)[,\t]\s*"?(.*?)"?\s*$/)||l.match(/^\s*((?:[1-3]\s?)?[^\d\s][^\d:]*?)\s+(\d{1,3})\s*[:.]\s*(\d{1,3})\s*[-–—.)]*\s*(.+)$/);
      if(m)put(matchBook(m[1]),+m[2],+m[3],m[4]);
    });
  }
  const map={};let books=0,verses=0;
  Object.keys(M).forEach(b=>{books++;M[b].forEach((ch,ci)=>{if(ch){const arr=Array.from(ch,t=>t||'');map[b+':'+(ci+1)]=arr;verses+=arr.length}})});
  return {map,books,verses};
}

/* Búsqueda local en los 66 libros */
function openSearch(){
  openSheet('Buscar en la Biblia',`<p class="note">Busca palabras o frases en los 66 libros de la RVR1960. La búsqueda se realiza en el dispositivo.</p><div class="searchbox"><input id="bq" type="search" placeholder="Ej. amor, fe, perdón…" autocomplete="off"><button id="bsearch">Buscar</button></div><div id="bresults" aria-live="polite"></div>`);
  $('bsearch').onclick=runBibleSearch;
  $('bq').onkeydown=e=>{if(e.key==='Enter')runBibleSearch()};
  $('bq').focus();
}
async function runBibleSearch(){
  const q=$('bq').value.trim(),out=$('bresults');
  if(q.length<2){out.innerHTML='<p class="searchmeta">Escribe al menos dos caracteres.</p>';return}
  out.innerHTML='<p class="searchmeta">Buscando en toda la Biblia…</p>';
  try{
    await chapterVerses(0,1);
    const needle=norm(q),found=[];
    outer: for(let b=0;b<BIBLE.length;b++){
      for(let c=0;c<BIBLE[b].length;c++){
        const ch=BIBLE[b][c]||[];
        for(let v=0;v<ch.length;v++){
          const text=String(ch[v]||'');
          if(norm(text).includes(needle)){
            found.push({b,c:c+1,v:v+1,text});
            if(found.length>=100)break outer;
          }
        }
      }
    }
    if(!found.length){out.innerHTML='<p class="searchmeta">No se encontraron coincidencias. Prueba con otra palabra.</p>';return}
    out.innerHTML=`<p class="searchmeta">${found.length===100?'Se muestran las primeras 100 coincidencias.':found.length+' coincidencias encontradas.'}</p>`+
      found.map(x=>`<button class="sresult" data-sb="${x.b}" data-sc="${x.c}" data-sv="${x.v}"><b>${B[x.b][0]} ${x.c}:${x.v}</b><small>${esc(x.text)}</small></button>`).join('');
  }catch(e){out.innerHTML=`<p class="searchmeta">${esc(e.message||'No se pudo realizar la búsqueda.')}</p>`}
}

/* Respaldo y restauración de los datos personales */
function exportBackup(){
  const storage={};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    // Solo datos propios de la app; nunca exportar la llave privada de Groq.
    if(k && k!=='bib_key' && /^bib_/.test(k))storage[k]=localStorage.getItem(k);
  }
  const payload={app:'Biblia RVR1960',format:1,createdAt:new Date().toISOString(),storage};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='respaldo-biblia-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function openBackup(){
  openSheet('Respaldo de mi Biblia',`<p>Guarda una copia de tus favoritos, resaltados, notas, planes, preferencias y progreso.</p><p class="note">El archivo de respaldo no incluye el texto bíblico porque ya está en biblia.json.</p><button class="save" id="exportbib">Descargar respaldo</button><h3>Restaurar respaldo</h3><p class="note">Al restaurar, los datos con la misma clave se reemplazarán por los del respaldo.</p><input class="backupfile" id="backupfile" type="file" accept="application/json,.json"><button class="act" id="importbib">Elegir archivo de respaldo</button>`);
  $('exportbib').onclick=exportBackup;
  $('importbib').onclick=()=>$('backupfile').click();
  $('backupfile').onchange=async e=>{
    const file=e.target.files&&e.target.files[0];if(!file)return;
    try{
      const data=JSON.parse(await file.text());
      if(data.app!=='Biblia RVR1960'||data.format!==1||!data.storage||typeof data.storage!=='object')throw new Error('El archivo no es un respaldo válido de esta aplicación.');
      if(!confirm('¿Restaurar este respaldo? Los datos existentes con las mismas claves serán reemplazados.'))return;
      Object.entries(data.storage).forEach(([k,v])=>{
        const allowed=k!=='bib_key'&&/^bib_/.test(k);
        if(allowed&&typeof v==='string'&&k.length<200)localStorage.setItem(k,v);
      });
      alert('Respaldo restaurado. La aplicación se actualizará.');
      location.reload();
    }catch(err){alert(err.message||'No se pudo restaurar el respaldo.')}
  };
}

const seq=(a,z)=>{const o=[];for(let b=a;b<=z;b++)for(let c=1;c<=B[b][2];c++)o.push([b,c]);return o};
const PLANS=[
 {id:'juan',n:'Evangelio de Juan',d:21,i:'Un capítulo al día. Ideal para empezar.',ch:seq(42,42)},
 {id:'ev',n:'Los 4 Evangelios',d:30,i:'La vida de Jesús en un mes.',ch:seq(39,42)},
 {id:'sp',n:'Salmos y Proverbios',d:31,i:'Sabiduría y oración para cada día del mes.',ch:seq(18,19)},
 {id:'nt',n:'Nuevo Testamento',d:90,i:'De Mateo a Apocalipsis en 3 meses.',ch:seq(39,65)},
 {id:'y1',n:'La Biblia en un año',d:365,i:'Todo el texto, de Génesis a Apocalipsis.',ch:seq(0,65)}
];
const dayCh=(p,i)=>p.ch.slice(Math.floor(i*p.ch.length/p.d),Math.floor((i+1)*p.ch.length/p.d));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function markRead(b,c){

/* Lectura en voz alta: divide capítulos largos para evitar límites del navegador. */
let speech=null,audioMode='idle',audioChunks=[],audioIndex=0,audioSession=0;
function stopAudio(){
  audioSession++;
  if('speechSynthesis' in window)window.speechSynthesis.cancel();
  speech=null;audioChunks=[];audioIndex=0;audioMode='idle';updateAudioButton();
}
function updateAudioButton(){
  const b=$('audio');if(!b)return;
  b.classList.toggle('playing',audioMode!=='idle');
  b.textContent=audioMode==='speaking'?'Ⅱ Pausar':audioMode==='paused'?'▶ Continuar':'▶ Escuchar';
  b.setAttribute('aria-label',audioMode==='speaking'?'Pausar lectura':audioMode==='paused'?'Continuar lectura':'Escuchar capítulo');
}
function speakAudioChunk(session){
  if(session!==audioSession)return;
  if(audioIndex>=audioChunks.length){audioMode='idle';speech=null;updateAudioButton();return}
  const utterance=new SpeechSynthesisUtterance(audioChunks[audioIndex]);speech=utterance;
  utterance.lang='es-MX';utterance.rate=.92;
  const voices=speechSynthesis.getVoices(),spanish=voices.find(v=>/^es(-|$)/i.test(v.lang));
  if(spanish)utterance.voice=spanish;
  utterance.onstart=()=>{if(session===audioSession){audioMode='speaking';updateAudioButton()}};
  utterance.onend=()=>{if(session===audioSession){audioIndex++;speakAudioChunk(session)}};
  utterance.onerror=()=>{if(session===audioSession){audioMode='idle';speech=null;audioChunks=[];updateAudioButton()}};
  speechSynthesis.speak(utterance);
}
function toggleAudio(){
  if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){alert('Este navegador no ofrece lectura en voz alta.');return}
  if(audioMode==='speaking'){speechSynthesis.pause();audioMode='paused';updateAudioButton();return}
  if(audioMode==='paused'){speechSynthesis.resume();audioMode='speaking';updateAudioButton();return}
  if(!verses.length){alert('Primero espera a que cargue el capítulo.');return}
  audioSession++;const session=audioSession;
  speechSynthesis.cancel();audioChunks=[];audioIndex=0;
  let chunk='';
  verses.forEach((v,i)=>{
    const part='Versículo '+(i+1)+'. '+v+' ';
    if(chunk.length+part.length>1300&&chunk){audioChunks.push(chunk);chunk=''}
    chunk+=part;
  });
  if(chunk)audioChunks.push(chunk);
  if(!audioChunks.length)return;
  audioMode='speaking';updateAudioButton();speakAudioChunk(session);
}

/* Preparar una copia local verificable para lectura sin internet */
async function prepareOffline(){
  const btn=$('offlineBtn'),info=$('offlineInfo');
  btn.disabled=true;btn.textContent='Preparando Biblia…';
  info.textContent='Descargando y verificando el texto bíblico completo. No cierres la aplicación.';
  try{
    const url=new URL('biblia.json',document.baseURI);
    const response=await fetch(url,{cache:'reload'});
    if(!response.ok)throw new Error('No se pudo descargar biblia.json (HTTP '+response.status+').');
    const data=await response.clone().json();
    if(!Array.isArray(data)||data.length!==66||data.some((book,i)=>!Array.isArray(book)||book.length!==B[i][2]||book.some(ch=>!Array.isArray(ch)||!ch.length||ch.some(v=>typeof v!=='string'))))throw new Error('El archivo descargado no superó la verificación de los 66 libros.');
    if(!('caches' in window))throw new Error('Este navegador no permite guardar la Biblia para uso sin conexión.');
    const cache=await caches.open(CACHE_NAME);
    await cache.put(url,response.clone());
    BIBLE=data;BIBLE_LOADING=Promise.resolve(data);
    let persistent='';
    try{if(navigator.storage&&navigator.storage.persist){const ok=await navigator.storage.persist();persistent=ok?' El navegador concedió almacenamiento persistente.':' El navegador podría liberar datos locales si necesita espacio.'}}catch(e){}
    let size='';
    try{const est=await navigator.storage.estimate();if(est&&est.usage)size=' Almacenamiento utilizado: '+(est.usage/1048576).toFixed(1)+' MB.'}catch(e){}
    info.textContent='Biblia descargada, verificada y guardada en este dispositivo. Ya puedes probar el modo avión.'+persistent+size;
    btn.textContent='Biblia lista sin conexión ✓';
  }catch(e){
    info.textContent=e.message||'No se pudo preparar la lectura sin conexión.';
    btn.textContent='Intentar nuevamente';
  }finally{btn.disabled=false}
}

/* Descarga automática inicial: deja los 66 libros disponibles sin conexión. */
async function warmOfflineBible(){
  if(!('caches' in window) || !navigator.onLine) return;
  try{
    const url=new URL('biblia.json',document.baseURI);
    const cache=await caches.open(CACHE_NAME);
    if(await cache.match(url)) return;
    const response=await fetch(url,{cache:'reload'});
    if(!response.ok) return;
    const data=await response.clone().json();
    if(!Array.isArray(data)||data.length!==66||data.some((book,i)=>!Array.isArray(book)||book.length!==B[i][2]||book.some(ch=>!Array.isArray(ch)||!ch.length||ch.some(v=>typeof v!=='string')))) return;
    await cache.put(url,response.clone());
    BIBLE=data;BIBLE_LOADING=Promise.resolve(data);
    try{if(navigator.storage?.persist)await navigator.storage.persist()}catch(e){}
  }catch(e){/* Si falla la descarga automática, se puede reintentar desde Ajustes. */}
}

const BOOK_CONTEXTS=[{"name": "Génesis", "author": "La tradición judía y cristiana vincula el Pentateuco con Moisés; su composición es debatida.", "context": "Desde los orígenes hasta la familia de Jacob en Egipto. Los relatos explican la creación, la ruptura humana y la promesa a Abraham.", "refs": ["Génesis 12:1-3", "Romanos 4:1-12"]}, {"name": "Éxodo", "author": "Atribución tradicional a Moisés; la formación del texto es debatida.", "context": "Israel pasa de la esclavitud en Egipto al pacto del Sinaí. La liberación conduce al servicio a Dios y a su presencia entre el pueblo.", "refs": ["Éxodo 19:1-6", "Deuteronomio 5:1-6"]}, {"name": "Levítico", "author": "Forma parte del Pentateuco, tradicionalmente asociado con Moisés.", "context": "El marco narrado es el campamento junto al Sinaí. Sacrificios, pureza y santidad organizan la vida de Israel alrededor del santuario.", "refs": ["Levítico 19:1-18", "Hebreos 9:1-14"]}, {"name": "Números", "author": "Forma parte del Pentateuco, tradicionalmente asociado con Moisés.", "context": "Relata el recorrido del Sinaí a las llanuras de Moab. Censos y relatos muestran el contraste entre la fidelidad divina y las rebeliones del pueblo.", "refs": ["Números 14:1-25", "1 Corintios 10:1-13"]}, {"name": "Deuteronomio", "author": "Presenta discursos de Moisés; la composición final del libro se debate.", "context": "En Moab, antes de entrar en Canaán, la nueva generación escucha de nuevo las exigencias del pacto. La memoria de la liberación sostiene la obediencia.", "refs": ["Deuteronomio 6:1-9", "Mateo 22:34-40"]}, {"name": "Josué", "author": "El libro no identifica a su autor; la tradición lo relaciona con Josué.", "context": "Narra la entrada en Canaán, la distribución de la tierra y la renovación del compromiso con Dios. Las narraciones de guerra requieren atención a su marco antiguo.", "refs": ["Josué 24:1-28", "Hebreos 4:1-11"]}, {"name": "Jueces", "author": "Autor no identificado en el texto.", "context": "Se sitúa entre la muerte de Josué y el establecimiento de la monarquía. Los ciclos de opresión y liberación desembocan en una crisis religiosa y social.", "refs": ["Jueces 2:6-23", "1 Samuel 8:1-22"]}, {"name": "Rut", "author": "Autor no identificado en el texto.", "context": "Una familia enfrenta hambre, migración y viudez en tiempos de los jueces. La lealtad de Rut y el cuidado de Booz se integran en la genealogía de David.", "refs": ["Rut 4:13-22", "Mateo 1:1-6"]}, {"name": "1 Samuel", "author": "Obra anónima; el nombre corresponde a un personaje central, no prueba la autoría.", "context": "Describe la transición de los jueces a la monarquía: Samuel, el reinado de Saúl y el surgimiento de David. El liderazgo se evalúa por su respuesta a Dios.", "refs": ["1 Samuel 8:1-22", "1 Samuel 16:1-13"]}, {"name": "2 Samuel", "author": "Obra anónima que continúa la narración de 1 Samuel.", "context": "El reinado de David reúne promesa, expansión, abuso de poder y conflictos familiares. Las consecuencias de sus decisiones no anulan la crítica profética.", "refs": ["2 Samuel 7:1-17", "Salmos 51"]}, {"name": "1 Reyes", "author": "Autor no identificado en el texto.", "context": "Desde Salomón hasta los reinos divididos, el templo y los profetas ocupan el centro. Los reyes son evaluados según su fidelidad al pacto.", "refs": ["1 Reyes 8:22-53", "Deuteronomio 17:14-20"]}, {"name": "2 Reyes", "author": "Obra anónima que continúa 1 Reyes.", "context": "Israel y Judá enfrentan crisis políticas y religiosas hasta la conquista asiria y la caída de Jerusalén ante Babilonia. El exilio constituye un desenlace central.", "refs": ["2 Reyes 17:6-23", "2 Reyes 25:1-21"]}, {"name": "1 Crónicas", "author": "Autor no identificado; la tradición lo asocia con Esdras.", "context": "Relee la historia de Israel mediante genealogías y el reinado de David, con especial atención al culto y al templo. Su perspectiva ayuda a pensar la identidad después del exilio.", "refs": ["1 Crónicas 17:1-15", "2 Samuel 7:1-17"]}, {"name": "2 Crónicas", "author": "Obra anónima que continúa 1 Crónicas.", "context": "Destaca el templo y los reyes de Judá. La narración culmina con el exilio y el decreto de Ciro, abriendo una expectativa de retorno.", "refs": ["2 Crónicas 36:11-23", "Esdras 1:1-4"]}, {"name": "Esdras", "author": "El libro incorpora memorias y documentos; su composición es discutida.", "context": "Bajo dominio persa, grupos de exiliados regresan a Judá. La reconstrucción del templo y la renovación de la comunidad encuentran oposición y tensiones.", "refs": ["Esdras 1:1-4", "Hageo 1:1-15"]}, {"name": "Nehemías", "author": "Incluye memorias en primera persona de Nehemías; la edición final se debate.", "context": "En el período persa, Nehemías impulsa la reconstrucción de los muros de Jerusalén. La reforma incluye justicia económica, lectura de la ley y organización comunitaria.", "refs": ["Nehemías 8:1-12", "Esdras 7:1-10"]}, {"name": "Ester", "author": "Autor no identificado en el texto.", "context": "La acción ocurre en la corte persa. Ester y Mardoqueo intervienen ante una amenaza contra los judíos; el relato explica la celebración de Purim.", "refs": ["Ester 4:1-17", "Ester 9:20-32"]}, {"name": "Job", "author": "Autor y fecha de composición no identificados con certeza.", "context": "Un justo que sufre dialoga con amigos que intentan explicar su dolor. El libro cuestiona la equivalencia automática entre sufrimiento y culpa individual.", "refs": ["Job 1:1-22", "Juan 9:1-7"]}, {"name": "Salmos", "author": "Colección de múltiples autores y tradiciones; algunos salmos tienen atribuciones en sus títulos.", "context": "Oraciones y cantos surgidos en diversos momentos de la vida de Israel. Lamento, alabanza y confianza expresan la fe tanto personal como comunitaria.", "refs": ["Salmos 1", "Lucas 24:44-49"]}, {"name": "Proverbios", "author": "Colección asociada con Salomón que también incluye otras voces, como Agur y Lemuel.", "context": "La sabiduría se transmite mediante sentencias y discursos para formar el carácter. Sus observaciones describen patrones de vida; no son garantías mecánicas para cada situación.", "refs": ["Proverbios 1:1-7", "Santiago 3:13-18"]}, {"name": "Eclesiastés", "author": "La voz se presenta como el Predicador, hijo de David; identidad y fecha se debaten.", "context": "Reflexiona sobre trabajo, muerte, placer y límites del conocimiento. La fugacidad de la vida invita a reconocer los límites humanos y recibir los bienes cotidianos.", "refs": ["Eclesiastés 3:1-15", "Eclesiastés 12:9-14"]}, {"name": "Cantares", "author": "Asociado con Salomón en el título; autoría y fecha son discutidas.", "context": "Poesía amorosa con voces de amantes e imágenes de jardines y naturaleza. Distingue el sentido poético inmediato de las interpretaciones alegóricas de distintas tradiciones.", "refs": ["Cantares 8:6-7", "Génesis 2:18-25"]}, {"name": "Isaías", "author": "Vinculado con Isaías hijo de Amoz; la formación de sus distintas secciones se debate.", "context": "El libro abarca amenazas contra Judá, juicio, exilio y esperanza de restauración. Conviene distinguir las situaciones de los capítulos 1–39, 40–55 y 56–66.", "refs": ["Isaías 6:1-13", "Lucas 4:16-21"]}, {"name": "Jeremías", "author": "Asociado con el profeta Jeremías e incluye el trabajo de Baruc.", "context": "En la crisis final de Judá y la caída de Jerusalén, denuncia la injusticia y la falsa seguridad religiosa. Junto al juicio anuncia restauración y un nuevo pacto.", "refs": ["Jeremías 31:31-34", "Hebreos 8:6-13"]}, {"name": "Lamentaciones", "author": "Anónimo; la tradición lo relaciona con Jeremías.", "context": "Poemas de duelo por la destrucción de Jerusalén expresan hambre, pérdida y desolación. El lamento forma parte de la respuesta creyente a una catástrofe colectiva.", "refs": ["Lamentaciones 3:19-33", "Salmos 137"]}, {"name": "Ezequiel", "author": "Asociado con el sacerdote y profeta Ezequiel.", "context": "Desde el exilio en Babilonia interpreta la caída de Jerusalén mediante visiones y acciones simbólicas. La esperanza incluye renovación interior y restauración de la presencia divina.", "refs": ["Ezequiel 36:22-28", "Juan 3:1-10"]}, {"name": "Daniel", "author": "La narración se centra en Daniel; la fecha y formación del libro son debatidas.", "context": "Relatos de fidelidad en cortes extranjeras se combinan con visiones de reinos y juicio. El simbolismo apocalíptico pide cautela al vincular imágenes con eventos actuales.", "refs": ["Daniel 7:1-14", "Apocalipsis 1:9-20"]}, {"name": "Oseas", "author": "Asociado con Oseas hijo de Beeri.", "context": "Profetiza sobre el reino del norte en una época de infidelidad y crisis. El lenguaje matrimonial denuncia la ruptura del pacto y expresa amor persistente.", "refs": ["Oseas 11:1-11", "Mateo 9:9-13"]}, {"name": "Joel", "author": "Asociado con Joel hijo de Petuel; su fecha es discutida.", "context": "Una plaga y el día del Señor enmarcan el llamado comunitario al arrepentimiento. La promesa del Espíritu recibe una lectura cristiana explícita en Hechos.", "refs": ["Joel 2:12-32", "Hechos 2:14-21"]}, {"name": "Amós", "author": "Asociado con Amós, procedente de Tecoa.", "context": "Denuncia opresión e injusticia en el reino del norte durante una época de prosperidad. El culto no reemplaza la justicia hacia el vulnerable.", "refs": ["Amós 5:21-24", "Santiago 5:1-6"]}, {"name": "Abdías", "author": "Asociado con Abdías; su identidad y fecha se discuten.", "context": "Denuncia la soberbia y la violencia de Edom contra Judá. El día del Señor sitúa esa conducta dentro de un horizonte de juicio y restauración.", "refs": ["Abdías 1:10-21", "Salmos 137:7"]}, {"name": "Jonás", "author": "Relato sobre el profeta Jonás; no se identifica a su autor.", "context": "La misión a Nínive y la resistencia del profeta confrontan el deseo de limitar la misericordia divina. El desenlace invita a examinar la propia respuesta ante el perdón al enemigo.", "refs": ["Jonás 4:1-11", "Mateo 12:38-41"]}, {"name": "Miqueas", "author": "Asociado con Miqueas de Moreset.", "context": "En el contexto de amenazas contra Israel y Judá denuncia abusos de gobernantes y líderes. Anuncia juicio y esperanza, vinculando fe, justicia y misericordia.", "refs": ["Miqueas 6:6-8", "Mateo 2:1-6"]}, {"name": "Nahúm", "author": "Asociado con Nahúm de Elcos.", "context": "Poemas anuncian la caída de Nínive, capital del poder asirio. El lenguaje de juicio se comprende en el marco de la violencia imperial padecida por los pueblos.", "refs": ["Nahúm 1:1-15", "Jonás 3:1-10"]}, {"name": "Habacuc", "author": "Presenta el diálogo del profeta Habacuc con Dios.", "context": "Ante la injusticia y la amenaza de Babilonia, el profeta pregunta cómo actúa Dios. El libro avanza desde la queja hacia una confianza que no oculta la dificultad.", "refs": ["Habacuc 2:1-4", "Romanos 1:16-17"]}, {"name": "Sofonías", "author": "Asociado con Sofonías, situado en tiempos de Josías.", "context": "El día del Señor confronta idolatría, abuso e indiferencia. Los llamados al juicio se acompañan de promesas para un pueblo humilde restaurado.", "refs": ["Sofonías 3:9-20", "Isaías 12:1-6"]}, {"name": "Hageo", "author": "Asociado con Hageo; sus mensajes se sitúan en el reinado persa de Darío.", "context": "La comunidad que regresó del exilio ha postergado la reconstrucción del templo. El profeta confronta prioridades y anima a retomar la obra.", "refs": ["Hageo 1:1-15", "Esdras 5:1-5"]}, {"name": "Zacarías", "author": "Vinculado con Zacarías; la composición de sus secciones se discute.", "context": "En el contexto de la restauración de Judá, visiones y oráculos anuncian renovación. Sus imágenes influyen en las narraciones cristianas de la entrada y pasión de Jesús.", "refs": ["Zacarías 9:9-10", "Mateo 21:1-11"]}, {"name": "Malaquías", "author": "El nombre puede entenderse como nombre propio o como «mi mensajero».", "context": "Con el templo nuevamente en funcionamiento, denuncia un culto descuidado y la infidelidad comunitaria. Anuncia purificación y la llegada de un mensajero.", "refs": ["Malaquías 3:1-5", "Marcos 1:1-8"]}, {"name": "Mateo", "author": "Evangelio anónimo en su cuerpo; la tradición lo atribuye a Mateo.", "context": "Presenta a Jesús en relación con las Escrituras de Israel. Grandes discursos, relatos de sanidad y la pasión forman discípulos para vivir y anunciar el reino.", "refs": ["Mateo 5:1-20", "Mateo 28:16-20"]}, {"name": "Marcos", "author": "Evangelio anónimo en su cuerpo; tradicionalmente atribuido a Marcos.", "context": "Su narración destaca la autoridad de Jesús, la dificultad de los discípulos para comprenderlo y el camino hacia la cruz. El servicio caracteriza el seguimiento.", "refs": ["Marcos 8:27-38", "Marcos 10:35-45"]}, {"name": "Lucas", "author": "Evangelio anónimo en su cuerpo; tradicionalmente atribuido a Lucas.", "context": "Dedicado a Teófilo, ofrece un relato ordenado y destaca misericordia, oración y atención a personas marginadas. Hechos continúa la narración.", "refs": ["Lucas 1:1-4", "Hechos 1:1-5"]}, {"name": "Juan", "author": "La tradición lo vincula con Juan; el evangelio menciona el testimonio del discípulo amado.", "context": "Señales y discursos presentan la identidad de Jesús y llaman a creer. Los conflictos y símbolos del relato deben leerse dentro de su desarrollo narrativo.", "refs": ["Juan 1:1-18", "Juan 20:30-31"]}, {"name": "Hechos", "author": "Continuación de Lucas, tradicionalmente atribuida al mismo autor.", "context": "Dedicado a Teófilo, sigue la expansión del mensaje desde Jerusalén hasta Roma. El Espíritu, la incorporación de gentiles y el testimonio apostólico articulan la obra.", "refs": ["Hechos 1:1-8", "Lucas 24:44-53"]}, {"name": "Romanos", "author": "Se presenta como carta de Pablo a los creyentes en Roma.", "context": "Pablo expone el evangelio para una comunidad de judíos y gentiles. Examina pecado, gracia, Israel y la vida comunitaria transformada por la misericordia.", "refs": ["Romanos 1:1-17", "Romanos 12:1-21"]}, {"name": "1 Corintios", "author": "Se presenta como carta de Pablo con Sóstenes.", "context": "Responde a divisiones e inquietudes de la iglesia de Corinto: moral, matrimonio, culto, dones y resurrección. Las instrucciones responden a problemas concretos de esa comunidad.", "refs": ["1 Corintios 1:1-17", "1 Corintios 15:1-11"]}, {"name": "2 Corintios", "author": "Se presenta como carta de Pablo con Timoteo.", "context": "En una relación tensa con Corinto, Pablo explica su ministerio y su debilidad. La reconciliación y la colecta para otros creyentes muestran dimensiones prácticas del evangelio.", "refs": ["2 Corintios 5:11-21", "2 Corintios 8:1-15"]}, {"name": "Gálatas", "author": "Se presenta como carta de Pablo a iglesias de Galacia.", "context": "Una disputa sobre la incorporación de gentiles y la circuncisión impulsa la defensa de la justificación por la fe. La libertad se concreta en amor y fruto del Espíritu.", "refs": ["Gálatas 2:15-21", "Gálatas 5:13-26"]}, {"name": "Efesios", "author": "Se presenta en nombre de Pablo; la autoría se debate en estudios académicos.", "context": "Expone la reconciliación de judíos y gentiles en Cristo y sus consecuencias para la iglesia. La unidad se expresa en conducta, relaciones y servicio.", "refs": ["Efesios 2:11-22", "Efesios 4:1-16"]}, {"name": "Filipenses", "author": "Se presenta como carta de Pablo con Timoteo.", "context": "Desde el encarcelamiento, Pablo agradece el apoyo de una comunidad cercana. Humildad, unidad y perseverancia se articulan en torno al ejemplo de Cristo.", "refs": ["Filipenses 1:1-14", "Filipenses 2:1-11"]}, {"name": "Colosenses", "author": "Se presenta en nombre de Pablo con Timoteo; la autoría se debate.", "context": "Exalta la centralidad de Cristo frente a enseñanzas y prácticas que preocupaban a la comunidad. La vida nueva se expresa en relaciones renovadas.", "refs": ["Colosenses 1:15-23", "Colosenses 3:1-17"]}, {"name": "1 Tesalonicenses", "author": "Se presenta como carta de Pablo, Silvano y Timoteo.", "context": "Anima a una comunidad joven que enfrenta dificultades. La vida santa y la esperanza de la venida del Señor acompañan el consuelo por los creyentes fallecidos.", "refs": ["1 Tesalonicenses 4:1-18", "Hechos 17:1-9"]}, {"name": "2 Tesalonicenses", "author": "Se presenta en nombre de Pablo, Silvano y Timoteo; su autoría se debate.", "context": "Trata persecución, expectativas sobre el día del Señor y desorden comunitario. Las imágenes del capítulo 2 han recibido interpretaciones diferentes.", "refs": ["2 Tesalonicenses 2:1-17", "1 Tesalonicenses 5:1-11"]}, {"name": "1 Timoteo", "author": "Se presenta en nombre de Pablo; las cartas pastorales tienen autoría debatida.", "context": "Dirigida a Timoteo, atiende enseñanza, liderazgo y convivencia en la iglesia. Las instrucciones concretas requieren considerar las situaciones y estructuras de las comunidades antiguas.", "refs": ["1 Timoteo 3:1-16", "Tito 1:5-9"]}, {"name": "2 Timoteo", "author": "Se presenta en nombre de Pablo; su autoría es debatida en estudios académicos.", "context": "Su tono de despedida anima a Timoteo a permanecer fiel en medio del sufrimiento. La transmisión de la enseñanza y la perseverancia centran la exhortación.", "refs": ["2 Timoteo 3:10-17", "2 Timoteo 4:1-8"]}, {"name": "Tito", "author": "Se presenta en nombre de Pablo; integra las cartas pastorales de autoría debatida.", "context": "Dirigida a Tito en Creta, relaciona liderazgo, enseñanza y buenas obras. La gracia sostiene la transformación de la vida comunitaria.", "refs": ["Tito 2:11-15", "Tito 3:1-8"]}, {"name": "Filemón", "author": "Se presenta como carta de Pablo con Timoteo.", "context": "Pablo intercede ante Filemón por Onésimo dentro de una sociedad esclavista. La fraternidad en Cristo transforma la relación; el texto no debe emplearse para justificar la esclavitud.", "refs": ["Filemón 1:8-21", "Gálatas 3:26-29"]}, {"name": "Hebreos", "author": "Autor no identificado en el texto; la atribución a Pablo no es segura.", "context": "La exhortación presenta a Cristo mediante las Escrituras, el sacerdocio y el santuario. Busca sostener a oyentes cansados o presionados a abandonar su confesión.", "refs": ["Hebreos 1:1-4", "Hebreos 10:19-25"]}, {"name": "Santiago", "author": "Se presenta como escrito de Santiago; la identificación y fecha se debaten.", "context": "Dirigido a las doce tribus en la dispersión, reclama coherencia entre fe y conducta. Presta especial atención al habla, la parcialidad y el uso de la riqueza.", "refs": ["Santiago 1:19-27", "Santiago 2:14-26"]}, {"name": "1 Pedro", "author": "Se presenta en nombre de Pedro; la autoría se debate en estudios académicos.", "context": "A creyentes de distintas regiones de Asia Menor les recuerda su esperanza en medio del rechazo social. Exhorta a una conducta honrada y al cuidado mutuo.", "refs": ["1 Pedro 1:1-9", "1 Pedro 4:12-19"]}, {"name": "2 Pedro", "author": "Se presenta en nombre de Pedro; su autoría es muy debatida.", "context": "Advierte contra falsas enseñanzas y exhorta a crecer en la fe. La aparente demora de la venida del Señor se aborda desde la paciencia divina.", "refs": ["2 Pedro 1:3-11", "2 Pedro 3:1-18"]}, {"name": "1 Juan", "author": "No identifica a su autor; la tradición lo vincula con Juan.", "context": "En un contexto de conflicto comunitario, relaciona la confesión sobre Jesús con amor y obediencia. Ofrece criterios de discernimiento y seguridad de la fe.", "refs": ["1 Juan 1:1-10", "1 Juan 4:7-21"]}, {"name": "2 Juan", "author": "El autor se presenta como el Anciano; su identidad se debate.", "context": "Una breve exhortación une verdad y amor y advierte sobre maestros que niegan la confesión sobre Cristo. La destinataria puede representar una comunidad.", "refs": ["2 Juan 1:4-11", "1 Juan 4:1-6"]}, {"name": "3 Juan", "author": "El autor se presenta como el Anciano y escribe a Gayo.", "context": "Contrasta hospitalidad y abuso de autoridad en una comunidad. El apoyo a quienes sirven al evangelio se vincula con la práctica de la verdad.", "refs": ["3 Juan 1:5-12", "Romanos 12:9-13"]}, {"name": "Judas", "author": "Se presenta como Judas, siervo de Jesucristo y hermano de Jacobo.", "context": "Exhorta a defender la fe frente a conductas destructivas. Usa ejemplos de las Escrituras y tradiciones judías que requieren atención a su contexto literario.", "refs": ["Judas 1:3-23", "2 Pedro 2:1-22"]}, {"name": "Apocalipsis", "author": "El autor se identifica como Juan; su relación con el apóstol se debate.", "context": "Dirigido a siete iglesias de Asia desde Patmos, combina cartas, profecía y visiones. Sus símbolos alientan fidelidad ante poderes opresores y esperanza en la nueva creación.", "refs": ["Apocalipsis 1:1-20", "Apocalipsis 21:1-8"]}];

function parseLocalRef(ref){
 const n=norm(ref);for(let b=B.length-1;b>=0;b--){const prefix=norm(B[b][0])+' ';if(!n.startsWith(prefix))continue;const m=n.slice(prefix.length).match(/^(\d+)(?::(\d+)(?:-(\d+))?)?$/);if(m)return {b,c:+m[1],v:+m[2]||1,end:+m[3]||+m[2]||null}}return null;
}
const REFERENCE_INDEX=new Map();
for(const item of CROSS_REFERENCES){
 for(const [from,to] of [[item.a,item.b],[item.b,item.a]]){
 const r=parseLocalRef(from);if(!r)continue;
 const key=r.b+':'+r.c;if(!REFERENCE_INDEX.has(key))REFERENCE_INDEX.set(key,[]);
 REFERENCE_INDEX.get(key).push({start:r.v,end:r.end,ref:to,nota:item.note});
 }
}
function localRefs(b,c,v){return (REFERENCE_INDEX.get(b+':'+c)||[]).filter(r=>v==null||(v>=r.start&&(r.end==null||v<=r.end))).map(({ref,nota})=>({ref,nota})).filter((r,i,a)=>a.findIndex(x=>x.ref===r.ref)===i)}
function chapterReferenceData(b,c){const versiculos={};for(let v=1;v<=verses.length;v++){const a=localRefs(b,c,v);if(a.length)versiculos[v]=a}return {secciones:[],versiculos}}

const CHAPTER_NOTES={"0:1": "El relato presenta la creación de forma ordenada y culmina con la humanidad hecha a imagen de Dios. El descanso del séptimo día aparece al comienzo del capítulo 2.", "0:3": "El encuentro con la serpiente, la desobediencia y sus consecuencias explican la ruptura de la relación con Dios. El relato continúa la escena del jardín del capítulo 2.", "0:12": "Después de los relatos de los orígenes, la narración se concentra en Abram. El llamado y la promesa de bendición a las familias de la tierra preceden su viaje y estancia en Egipto.", "0:22": "La prueba de Abraham gira en torno a Isaac, el hijo ligado a la promesa. La provisión del carnero impide el sacrificio de Isaac y la promesa vuelve a ser afirmada.", "1:3": "Moisés encuentra la zarza mientras pastorea. Dios escucha el clamor de Israel, lo llama a sacar al pueblo de Egipto y responde a sus objeciones.", "1:20": "Después de la liberación y la llegada al Sinaí, Dios comunica los mandamientos. La introducción recuerda la salida de Egipto: la ley aparece dentro de una relación de pacto.", "4:6": "Moisés llama a Israel a escuchar y amar al Señor. La enseñanza del pacto debe formar la vida cotidiana, familiar y comunitaria, sin olvidar la liberación.", "5:1": "Tras la muerte de Moisés, Josué recibe el encargo de conducir al pueblo. La exhortación al valor está unida a meditar y obedecer la ley, dentro de esa misión concreta.", "7:1": "El hambre lleva a una familia a Moab; después de varias muertes, Noemí decide regresar a Belén. Rut elige acompañarla en una situación de vulnerabilidad.", "9:7": "David desea construir una casa para Dios, pero la respuesta profética coloca en primer plano la promesa divina de una casa o dinastía para David.", "18:23": "La voz del salmo expresa confianza mediante las imágenes del pastor y del anfitrión. El peligro no desaparece, pero se afirma la compañía y el cuidado de Dios.", "18:51": "Es una oración penitencial. Su título la relaciona con David y la denuncia de Natán. Confesión, limpieza y renovación interior orientan el poema.", "18:119": "Este extenso poema celebra la instrucción de Dios mediante múltiples términos e imágenes. Su forma alfabética hebrea organiza una meditación sobre la fidelidad y la oración.", "19:3": "La instrucción invita a confiar en el Señor y practicar sabiduría, generosidad y trato justo. Sus afirmaciones sapienciales deben leerse como orientación para la vida, no como garantía automática de prosperidad.", "22:53": "El poema describe a un siervo que sufre, es rechazado y carga con las faltas de otros. El Nuevo Testamento aplica su lenguaje a Jesús; la identidad del siervo en el marco de Isaías se interpreta de diversas maneras.", "23:29": "La carta a los desterrados llama a construir una vida en Babilonia y buscar el bienestar de la ciudad. La promesa de futuro se dirige a esa comunidad en exilio, no garantiza resultados inmediatos a cada individuo.", "26:6": "La fidelidad de Daniel en la oración lo enfrenta al decreto real. La narración muestra su liberación del foso de los leones y el reconocimiento del Dios al que sirve.", "39:5": "El Sermón del Monte comienza con bienaventuranzas y presenta la identidad de los discípulos como sal y luz. Jesús aborda la ley y profundiza en conducta, intención y amor al enemigo.", "39:6": "Jesús enseña sobre limosna, oración, ayuno, tesoros y preocupación. Contrapone la búsqueda de reconocimiento público con la relación sincera con el Padre.", "39:13": "Las parábolas del reino y la explicación del sembrador ponen atención en la recepción del mensaje. No todos los detalles de una parábola deben convertirse en símbolos independientes.", "39:18": "La enseñanza a los discípulos relaciona humildad, cuidado del pequeño, corrección y perdón. La reconciliación no autoriza encubrir daños ni obliga a permanecer en peligro.", "39:28": "Las mujeres encuentran la tumba vacía y reciben el anuncio de la resurrección. El evangelio termina con Jesús comisionando a sus discípulos para hacer discípulos de todas las naciones.", "40:4": "El capítulo reúne parábolas sobre la semilla y el crecimiento del reino. Termina con la tempestad calmada, que provoca una nueva pregunta sobre la identidad de Jesús.", "40:10": "En el camino a Jerusalén se suceden enseñanzas sobre matrimonio, niños, riqueza y servicio. El anuncio de la pasión da marco al contraste entre ambición y entrega.", "41:10": "Jesús envía a un grupo de discípulos y enseña mediante el encuentro con el intérprete de la ley. La parábola del samaritano desplaza la pregunta hacia actuar como prójimo; el capítulo termina con Marta y María.", "41:15": "Ante las críticas por recibir a pecadores, Jesús cuenta las parábolas de la oveja, la moneda y los dos hijos. La alegría por lo recuperado y la reacción del hermano mayor articulan el conjunto.", "42:1": "El prólogo presenta a la Palabra y su encarnación. Después aparecen el testimonio de Juan y los primeros encuentros con discípulos que comienzan a reconocer a Jesús.", "42:3": "El diálogo con Nicodemo trata del nacimiento de arriba, el Espíritu y la fe. La imagen de la serpiente levantada remite a Números; después se contrasta la misión de Jesús con el testimonio de Juan.", "42:10": "Las imágenes de la puerta y el buen pastor siguen la curación del ciego y la controversia del capítulo anterior. El discurso contrasta el cuidado verdadero del rebaño con el abandono y provoca división.", "42:11": "La muerte de Lázaro da lugar a diálogos sobre duelo, fe y resurrección. La señal conduce a reacciones de fe y a una mayor decisión de las autoridades de actuar contra Jesús.", "42:13": "En la cena previa a la pasión, Jesús lava los pies de sus discípulos y explica el servicio mutuo. El anuncio de la traición y el mandamiento del amor preparan los discursos de despedida.", "42:14": "Ante la inquietud de los discípulos, Jesús habla del Padre, de su partida y de la promesa del Consolador. El amor se relaciona con guardar sus mandamientos y recibir su paz.", "42:15": "La vid y los pámpanos ilustran la dependencia de los discípulos respecto de Jesús. Permanecer, amar y dar fruto se unen a la advertencia sobre la oposición que encontrarán.", "43:2": "En Pentecostés, el Espíritu capacita el testimonio y Pedro interpreta lo ocurrido recurriendo a Joel y los Salmos. La respuesta al anuncio culmina en bautismos y vida comunitaria.", "43:15": "La comunidad discute si los gentiles deben circuncidarse para pertenecer al pueblo de Dios. Testimonios, deliberación y Escritura conducen a una comunicación dirigida a esas iglesias.", "44:3": "Pablo sostiene que judíos y gentiles comparten la condición de pecado. A continuación expone la justicia de Dios y la justificación por la fe, excluyendo la jactancia.", "44:8": "La vida en el Espíritu contrasta con la condenación y la esclavitud. El capítulo relaciona adopción, sufrimiento, esperanza y seguridad en el amor de Dios.", "44:12": "Tras exponer la misericordia divina, Pablo llama a una vida transformada. Dones, amor sincero, trato al enemigo y convivencia constituyen la respuesta práctica.", "45:13": "Entre los capítulos sobre dones y culto comunitario, Pablo afirma la prioridad del amor. La descripción corrige el uso de capacidades espirituales como motivo de prestigio.", "45:15": "Ante quienes negaban la resurrección de los muertos, Pablo recuerda el mensaje recibido sobre Cristo. Explica la relación entre su resurrección, la esperanza futura y la conducta presente.", "47:5": "La libertad en Cristo no se presenta como permiso para dañar, sino como servicio por amor. La vida en el Espíritu se reconoce por su fruto y se contrapone a las obras de la carne.", "48:2": "La salvación por gracia desemboca en una vida de buenas obras. La segunda parte desarrolla la reconciliación entre judíos y gentiles en un solo pueblo.", "49:4": "Pablo exhorta a la unidad, al gozo y a la oración, y agradece el apoyo recibido. La afirmación sobre poder afrontar las circunstancias está ligada al contentamiento en abundancia y escasez.", "57:11": "Los ejemplos de fe recorren la historia bíblica y animan a perseverar. Algunos reciben liberación y otros sufren: la fe no se presenta como garantía de evitar toda dificultad.", "58:2": "Santiago denuncia la parcialidad hacia los ricos y exige coherencia entre fe y obras. Los ejemplos de Abraham y Rahab sirven a ese argumento práctico.", "61:4": "El discernimiento de los espíritus se vincula con la confesión sobre Jesús. La segunda parte presenta el amor de Dios como fundamento del amor mutuo.", "65:21": "La visión de cielo nuevo y tierra nueva presenta la presencia de Dios con su pueblo y el fin de muerte y dolor. La nueva Jerusalén se describe con imágenes de ciudad, santuario y pueblo."};
