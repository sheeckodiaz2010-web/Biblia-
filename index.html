<style>
:root{--bg:#f4f5f3;--fg:#1d2230;--mut:#69708a;--ac:#2b4db8;--acbg:#e3e9fb;--line:#d8dbe3;--sh:#fff;--hl:#fff3b8;--h1:#fff0a8;--h2:#cdeccb;--h3:#cfe3fb;--h4:#f9d3de;
--serif:'Literata',Georgia,serif;--sans:system-ui,-apple-system,'Segoe UI',sans-serif;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#12151f;--fg:#e6e6e0;--mut:#9aa1b8;--ac:#93abff;--acbg:#1f2744;--line:#2a3045;--sh:#1b2030;--hl:#4a4320;--h1:#4a4320;--h2:#24432a;--h3:#20395c;--h4:#5a2a3c}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--sans);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
button{font:inherit;color:inherit;cursor:pointer}
#pick{background:none;border:0;font:600 19px var(--serif);padding:6px 4px;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lf{display:flex;align-items:center;gap:6px;min-width:0}
#ver{font:600 12px var(--sans);background:var(--acbg);color:var(--ac);border:0;border-radius:999px;padding:5px 9px;white-space:nowrap}
#cfg{background:none;border:0;font-size:20px;color:var(--mut);padding:6px 8px}
main{max-width:640px;margin:0 auto;padding:18px 18px 8px}
#text,.pv{font-family:var(--rf,var(--serif));font-size:var(--rs,19px);line-height:1.75;font-weight:400}
.pv .v{margin:0 0 .5em}
.row{display:flex;gap:8px;margin-top:16px}
.row button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.row .p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
#back{display:none;background:var(--acbg);color:var(--ac);border:0;border-radius:10px;padding:7px 11px;font-weight:600}
#back.on{display:block}
.v{margin:0 0 .55em}
.v.m{border-radius:6px;padding:2px 6px;margin-left:-6px;margin-right:-6px}
.v.h1{background:var(--h1)}.v.h2{background:var(--h2)}.v.h3{background:var(--h3)}.v.h4{background:var(--h4)}
.v.h5{text-decoration:underline;text-decoration-color:var(--ac);text-decoration-thickness:2px;text-underline-offset:5px}
.v.jump{outline:2px solid var(--ac);outline-offset:3px;border-radius:6px}
.v.bm .n::before{content:'🔖 '}
button.x{background:var(--acbg);color:var(--ac);border:0;border-radius:6px;font:600 14px/1 var(--sans);padding:4px 7px;margin-left:6px;vertical-align:middle;cursor:pointer}
.sec{font:600 15px var(--sans);color:var(--ac);margin:24px 0 8px}
.rt{display:flex;gap:2px}
#gd{background:none;border:0;font-size:19px;padding:6px 8px}
.colors{display:flex;gap:10px;margin:8px 0 4px;flex-wrap:wrap}
.colors button{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
.colors .c1{background:var(--h1)}.colors .c2{background:var(--h2)}.colors .c3{background:var(--h3)}.colors .c4{background:var(--h4)}
.colors .c5{text-decoration:underline;text-decoration-color:var(--ac);text-decoration-thickness:2px;font-weight:600}
.colors button.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.act{display:block;width:100%;text-align:left;padding:13px 14px;margin-top:8px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.it{display:flex;gap:8px;align-items:flex-start;margin:10px 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.it .go{flex:1;background:none;border:0;text-align:left;padding:0}
.it b{color:var(--ac)}.it small{display:block;color:var(--mut);margin-top:2px;font-size:14px}
.rm{background:none;border:0;color:var(--mut);padding:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:6px;background:var(--h1);border:1px solid var(--line)}
.dot.h2{background:var(--h2)}.dot.h3{background:var(--h3)}.dot.h4{background:var(--h4)}.dot.h5{background:var(--ac)}
#upd{position:fixed;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top,0px));z-index:12;background:var(--ac);color:#fff;border-radius:14px;padding:10px 12px;display:none;align-items:center;gap:10px;box-shadow:0 4px 18px #0004}
#upd.on{display:flex}#upd span{flex:1;font-weight:600}
#upd button{border:0;border-radius:10px;padding:8px 12px;font-weight:600;background:#fff;color:#1d2230}
#upd #updx{background:none;color:inherit;padding:8px}
.n{font:600 12px var(--sans);color:var(--ac);background:none;border:0;padding:0 4px 0 0;vertical-align:super;cursor:pointer}
.w{cursor:pointer;border-radius:3px}
.w:active,.w.on{background:var(--acbg)}
.msg{color:var(--mut);padding:30px 0;text-align:center;font-family:var(--sans)}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
nav.bar button{flex:1;padding:13px 8px;border-radius:12px;border:1px solid var(--line);background:var(--sh)}
nav.bar #ctx{flex:1.6;background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
@media(prefers-color-scheme:dark){nav.bar #ctx,.row .p,.save,.grid button.cur,#upd{color:#0d1224}#upd{background:var(--ac)}}
#ov{position:fixed;inset:0;background:#0007;z-index:8;display:none}
#sh{position:fixed;left:0;right:0;bottom:0;z-index:9;max-height:80vh;background:var(--sh);border-radius:20px 20px 0 0;border-top:1px solid var(--line);transform:translateY(105%);transition:transform .25s;display:flex;flex-direction:column}
#sh.open{transform:none}
#ov.open{display:block}
#sh header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 6px}
#st{margin:0;font:600 18px var(--serif)}
#sx{background:none;border:0;font-size:18px;color:var(--mut);padding:6px}
#sb{overflow:auto;padding:4px 18px calc(24px + env(safe-area-inset-bottom,0px));line-height:1.55;font-size:16px}
#sb h3{font:600 15px var(--sans);margin:18px 0 4px;color:var(--ac)}
#sb p{margin:0 0 6px}
#sb ul{margin:0;padding-left:20px}
#sb li{margin:3px 0}
.ref{background:var(--acbg);color:var(--ac);border:0;border-radius:8px;padding:3px 9px;margin:2px 0;font-weight:600}
.refrow{margin:6px 0}
.refrow span{color:var(--mut);font-size:15px}
select,input{width:100%;font:inherit;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin-top:14px}
.grid button{padding:11px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.grid button.cur{background:var(--ac);color:#fff;border-color:var(--ac)}
.save{margin-top:12px;width:100%;padding:13px;border-radius:12px;border:0;background:var(--ac);color:#fff;font-weight:600}
.note{color:var(--mut);font-size:14px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media(prefers-reduced-motion:reduce){#sh{transition:none}}
</style>
</head>
<body>
<header class="top"><span class="lf"><button id="pick" aria-label="Elegir libro y capítulo">Juan 1 ▾</button><button id="ver" aria-label="Cambiar de Biblia"></button></span><button id="back" aria-label="Volver al texto anterior"></button><span class="rt"><button id="gd" aria-label="Guardados">🔖</button><button id="cfg" aria-label="Ajustes">⚙</button></span></header>

<script>
const VERSION='2026-10-28.4';
const B=[["Génesis","Genesis",50],["Éxodo","Exodus",40],["Levítico","Leviticus",27],["Números","Numbers",36],["Deuteronomio","Deuteronomy",34],["Josué","Joshua",24],["Jueces","Judges",21],["Rut","Ruth",4],["1 Samuel","1 Samuel",31],["2 Samuel","2 Samuel",24],["1 Reyes","1 Kings",22],["2 Reyes","2 Kings",25],["1 Crónicas","1 Chronicles",29],["2 Crónicas","2 Chronicles",36],["Esdras","Ezra",10],["Nehemías","Nehemiah",13],["Ester","Esther",10],["Job","Job",42],["Salmos","Psalms",150],["Proverbios","Proverbs",31],["Eclesiastés","Ecclesiastes",12],["Cantares","Song of Solomon",8],["Isaías","Isaiah",66],["Jeremías","Jeremiah",52],["Lamentaciones","Lamentations",5],["Ezequiel","Ezekiel",48],["Daniel","Daniel",12],["Oseas","Hosea",14],["Joel","Joel",3],["Amós","Amos",9],["Abdías","Obadiah",1],["Jonás","Jonah",4],["Miqueas","Micah",7],["Nahúm","Nahum",3],["Habacuc","Habakkuk",3],["Sofonías","Zephaniah",3],["Hageo","Haggai",2],["Zacarías","Zechariah",14],["Malaquías","Malachi",4],["Mateo","Matthew",28],["Marcos","Mark",16],["Lucas","Luke",24],["Juan","John",21],["Hechos","Acts",28],["Romanos","Romans",16],["1 Corintios","1 Corinthians",16],["2 Corintios","2 Corinthians",13],["Gálatas","Galatians",6],["Efesios","Ephesians",6],["Filipenses","Philippians",4],["Colosenses","Colossians",4],["1 Tesalonicenses","1 Thessalonians",5],["2 Tesalonicenses","2 Thessalonians",3],["1 Timoteo","1 Timothy",6],["2 Timoteo","2 Timothy",4],["Tito","Titus",3],["Filemón","Philemon",1],["Hebreos","Hebrews",13],["Santiago","James",5],["1 Pedro","1 Peter",5],["2 Pedro","2 Peter",3],["1 Juan","1 John",5],["2 Juan","2 John",1],["3 Juan","3 John",1],["Judas","Jude",1],["Apocalipsis","Revelation",22]];
const API='https://bss-api.thechurchofgod.info/api';
const $=id=>document.getElementById(id);
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
let S={b:42,c:1,v:null},verses=[];
const J=k=>{try{return JSON.parse(ls.get(k))||{}}catch(e){return {}}};
const vk=(b,c,v)=>b+':'+c+':'+v;
try{const p=JSON.parse(ls.get('bib_pos'));if(p&&B[p.b])S={b:p.b,c:p.c,v:null}}catch(e){}

/* Panel inferior */
function openSheet(t,h){$('st').textContent=t;$('sb').innerHTML=h;$('sh').classList.add('open');$('ov').classList.add('open');$('sb').scrollTop=0}
function closeSheet(){$('sh').classList.remove('open');$('ov').classList.remove('open');document.querySelectorAll('.w.on').forEach(e=>e.classList.remove('on'))}
$('sx').onclick=closeSheet;$('ov').onclick=closeSheet;

/* Groq */
async function groq(sys,user,json){
  const k=ls.get('bib_key');
  if(!k){settings('Pega tu llave de Groq para usar la IA.');throw new Error('SIN_LLAVE')}
  const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+k},
    body:JSON.stringify({model:'openai/gpt-oss-120b',reasoning_effort:'low',temperature:.3,messages:[{role:'system',content:sys},{role:'user',content:user}],...(json?{response_format:{type:'json_object'}}:{})})});
  if(!r.ok)throw new Error(r.status===401?'La llave de Groq no es válida.':'Groq respondió con error '+r.status+'.');
  return (await r.json()).choices[0].message.content;
}
const SYS='Eres un maestro de la Biblia claro y sereno. Explicas en español sencillo a un lector común, sin tecnicismos ni sermones. Si no estás seguro de un dato (autor, fecha, lugar), dilo y da lo que la mayoría de los estudiosos acepta. Los textos son de la Reina-Valera.';
const parse=t=>JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));
const errHtml=e=>e.message==='SIN_LLAVE'?'':`<p class="note">${esc(e.message||'No se pudo completar. Revisa tu internet e intenta de nuevo.')}</p>`;
const NAMES=B.map(b=>b[0]).join(', ');

/* Referencias tocables */
function refBtn(ref){
  const n=norm(ref);let best=-1,len=0;
  B.forEach((b,i)=>{const x=norm(b[0])+' ';if(n.startsWith(x)&&x.length>len){best=i;len=x.length}});
  if(best<0)return esc(ref);
  const m=n.slice(len).match(/^(\d+)(?::(\d+)(?:[-–](\d+))?)?/);
  if(!m)return esc(ref);
  return `<button class="ref" data-b="${best}" data-c="${m[1]}" data-v="${m[2]||''}" data-e="${m[3]||''}">${esc(ref)}</button>`;
}
const RE=new RegExp('('+B.map(b=>b[0]).sort((a,b)=>b.length-a.length).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\s+\\d+(?::\\d+(?:[-–]\\d+)?)?','gi');
const L=t=>esc(t).replace(RE,(m,_n,off,str)=>/[\p{L}\d]/u.test(str[off-1]||'')?m:refBtn(m));
const clean=(l,b,c,v)=>(Array.isArray(l)?l:[]).filter(r=>r&&r.ref&&norm(String(r.ref))!==norm(B[b][0]+' '+c+':'+v));
const refList=a=>(a||[]).map(r=>`<div class="refrow">${refBtn(r.ref)} <span>${L(r.nota)}</span></div>`).join('');
let hist=[];
function upBack(){const x=hist[hist.length-1];$('back').classList.toggle('on',!!x);if(x)$('back').textContent='↩ '+B[x.b][0]+' '+x.c}
async function preview(b,c,v,e,prev){
  const q=EN[b]+' '+c+(v?':'+v+(e?'-'+e:''):''),ref=B[b][0]+' '+c+(v?':'+v+(e?'-'+e:''):'');
  openSheet(ref,'<p class="note">Cargando el pasaje…</p>');
  const bar=`<div class="row"><button id="pvb">‹ Volver</button><button class="p" id="pvg">Ir al capítulo</button></div>`;
  try{
    const all=await chapterVerses(b,c),from=v||1,to=v?(e||v):all.length;
    const a=all.slice(from-1,to).map((t,i)=>({verse:from+i,text:t}));
    if(!a.length)throw new Error('No se pudo cargar el pasaje.');
    $('sb').innerHTML='<div class="pv">'+a.map(x=>`<p class="v"><span class="n">${x.verse}</span>${esc(x.text)}</p>`).join('')+'</div>'+bar;
  }catch(er){$('sb').innerHTML=`<p class="note">${esc(er.message==='Failed to fetch'?'No se pudo conectar. Revisa tu internet.':er.message)}</p>`+bar}
  $('pvb').onclick=()=>openSheet(prev.t,prev.h);
  $('pvg').onclick=()=>{hist.push({b:S.b,c:S.c,y:window.scrollY,sheet:prev});go(b,c,v)};
}
$('sb').addEventListener('click',e=>{
  const t=e.target.closest('.ref');if(!t)return;
  const b=+t.dataset.b,c=Math.min(+t.dataset.c,B[b][2]);
  preview(b,c,t.dataset.v?+t.dataset.v:null,t.dataset.e?+t.dataset.e:null,{t:$('st').textContent,h:$('sb').innerHTML});
});
$('back').onclick=async()=>{
  const x=hist.pop();if(!x)return;
  S={b:x.b,c:x.c,v:null};closeSheet();await load();window.scrollTo(0,x.y);upBack();
  if(x.sheet)openSheet(x.sheet.t,x.sheet.h);
};

/* Texto: en línea (RVR1909) o Biblia importada (guardada solo en este dispositivo) */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('bib',1);r.onupgradeneeded=()=>r.result.createObjectStore('ch');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idbSet(map){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('ch','readwrite'),o=t.objectStore('ch');o.clear();for(const k in map)o.put(map[k],k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const r=db.transaction('ch').objectStore('ch').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbClear(){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('ch','readwrite');t.objectStore('ch').clear();t.oncomplete=res;t.onerror=()=>rej(t.error)})}
const hasImp=()=>ls.get('bib_imp')==='1'||ls.get('bib_src')==='import';
const verLabel=()=>ls.get('bib_src')==='import'?(ls.get('bib_imp_name')||'Importada'):'RVR1909';
function setVer(){$('ver').textContent=verLabel()}
$('ver').onclick=()=>{
  const imp=ls.get('bib_src')==='import';
  openSheet('Biblia',`<button class="act" id="v1">${imp?'':'✓ '}Reina-Valera 1909 (en línea)</button>${hasImp()?`<button class="act" id="v2">${imp?'✓ ':''}${esc(ls.get('bib_imp_name')||'Mi Biblia importada')}</button>`:''}<button class="act" id="v3">Importar otra Biblia…</button>`);
  $('v1').onclick=()=>{ls.set('bib_src','online');setVer();closeSheet();load()};
  if($('v2'))$('v2').onclick=()=>{ls.set('bib_src','import');setVer();closeSheet();load()};
  $('v3').onclick=()=>settings();
};
async function chapterVerses(b,c){
  if(ls.get('bib_src')==='import'){
    const v=await idbGet(b+':'+c).catch(()=>null);
    if(v&&v.length)return v;
    throw new Error('Ese capítulo no está en tu Biblia importada.');
  }
  const r=await fetch(`${API}?bible=rv_1909&data_format=minimal&reference=${encodeURIComponent(EN[b]+' '+c)}`);
  const j=await r.json().catch(()=>({}));
  if(!r.ok||(j.errors&&j.errors.length))throw new Error((j.errors&&j.errors[0])||'El servidor respondió '+r.status);
  const a=j.results&&j.results.rv_1909;
  if(!a||!a.length)throw new Error('La respuesta llegó vacía');
  return a.sort((x,y)=>x.verse-y.verse).map(x=>x.text);
}
function matchBook(n){
  n=norm(String(n)).replace(/\./g,'').replace(/\s+/g,' ');
  const al={'cantar de los cantares':'cantares','el cantar de los cantares':'cantares','cantares de salomon':'cantares','canticos':'cantares','hechos de los apostoles':'hechos','salmo':'salmos','apocalipsis de san juan':'apocalipsis','san juan':'juan','san mateo':'mateo','san marcos':'marcos','san lucas':'lucas'};
  if(al[n])n=al[n];
  let i=B.findIndex(b=>norm(b[0])===n);if(i<0)i=B.findIndex(b=>norm(b[1])===n);
  if(i<0){const m=n.replace(/^(san|santo|s)\s?/,'');if(m!==n){i=B.findIndex(b=>norm(b[0])===m)}}
  return i;
}
function parseBible(txt){
  txt=txt.replace(/^\uFEFF/,'');
  const M={};
  const put=(b,c,v,t)=>{if(!(b>=0&&b<66)||!(c>0)||!(v>0)||!t)return;(M[b]=M[b]||[]);(M[b][c-1]=M[b][c-1]||[])[v-1]=String(t).trim()};
  let data=null;try{data=JSON.parse(txt)}catch(e){}
  if(data){
    const flat=a=>a.forEach(x=>{const bk=x.book_id??x.book_number??x.book??x.book_name??x.bookName??x.libro;put((typeof bk==='number'||/^\d+$/.test(String(bk)))?+bk-1:matchBook(bk),+(x.chapter??x.capitulo),+(x.verse??x.versiculo),x.text??x.texto)});
    if(Array.isArray(data)){
      if(data[0]&&data[0].chapters)data.forEach((bk,i)=>{const b=data.length===66?i:matchBook(bk.name||bk.abbrev);(bk.chapters||[]).forEach((ch,ci)=>(Array.isArray(ch)?ch:Object.values(ch)).forEach((t,vi)=>put(b,ci+1,vi+1,typeof t==='string'?t:t&&t.text)))});
      else flat(data);
    }else if(Array.isArray(data.verses))flat(data.verses);
    else Object.keys(data).forEach(k=>{const b=matchBook(k),ch=data[k];(Array.isArray(ch)?ch.map((x,i)=>[i+1,x]):Object.entries(ch||{}).map(([c,x])=>[+c,x])).forEach(([c,x])=>(Array.isArray(x)?x.map((t,i)=>[i+1,t]):Object.entries(x||{}).map(([v,t])=>[+v,t])).forEach(([v,t])=>put(b,c,v,t)))});
  }else{
    txt.split(/\r?\n/).forEach(l=>{
      const m=l.match(/^\s*"?([^",\t]+?)"?[,\t]\s*(\d+)[,\t]\s*(\d+)[,\t]\s*"?(.*?)"?\s*$/)||l.match(/^\s*((?:[1-3]\s?)?[^\d\s][^\d:]*?)\s+(\d{1,3})\s*[:.]\s*(\d{1,3})\s*[-–—.)]*\s*(.+)$/);
      if(m)put(matchBook(m[1]),+m[2],+m[3],m[4]);
    });
  }
  const map={};let books=0,verses=0;
  Object.keys(M).forEach(b=>{books++;M[b].forEach((ch,ci)=>{if(ch){const arr=Array.from(ch,t=>t||'');map[b+':'+(ci+1)]=arr;verses+=arr.length}})});
  return {map,books,verses};
}

/* Texto con marcas, títulos y flechas de referencias */
function buildText(){
  const hl=J('bib_hl'),bm=J('bib_bm'),xr=J('xr2:'+S.b+':'+S.c),sec={};
  (xr.secciones||[]).forEach(x=>{if(x&&x.v&&x.titulo)sec[x.v]=x.titulo});
  $('text').innerHTML=verses.map((t,i)=>{
    const n=i+1,k=vk(S.b,S.c,n),h=hl[k],cls=['v'];
    if(h)cls.push('m','h'+h.c);if(bm[k])cls.push('bm');if(S.v===n)cls.push('jump');
    const has=xr.versiculos&&xr.versiculos[n]&&xr.versiculos[n].length;
    return (sec[n]?`<h2 class="sec">${esc(sec[n])}</h2>`:'')+`<p class="${cls.join(' ')}" data-v="${n}"><button class="n" aria-label="Opciones del versículo ${n}">${n}</button>${t.replace(/([\p{L}]+)/gu,'<span class="w">$1</span>')}${has?`<button class="x" aria-label="Referencias del versículo ${n}">↗</button>`:''}</p>`;
  }).join('');
}
async function loadXr(){
  if(ls.get('bib_xr')==='0'||!ls.get('bib_key'))return;
  const key='xr2:'+S.b+':'+S.c;if(ls.get(key))return;
  const sig=S.b+':'+S.c,ref=B[S.b][0]+' '+S.c;
  try{
    const nums=verses.map((t,i)=>(i+1)+' '+t.slice(0,110)).join('\n');
    const d=parse(await groq(SYS,`Texto de ${ref}:\n${nums}\n\nPara este capítulo responde SOLO un JSON con: "secciones": lista de {"v","titulo"} con títulos cortos (máximo 8 palabras) como los de una Biblia de estudio, donde "v" es el número del versículo en que empieza cada sección; "versiculos": objeto cuyas claves son números de versículo de la lista de arriba y cuyos valores son listas de 1 a 3 objetos {"ref","nota"} con OTROS pasajes de la Biblia que de verdad se relacionen con ese versículo (nunca el mismo versículo), solo para los versículos que tengan referencias importantes (máximo 15 versículos). "ref" con el formato "Libro cap:ver" usando exactamente estos nombres de libro: ${NAMES}; "nota" de una línea que explique cómo se relaciona con ese versículo, sin repetir su texto.`,true));
    const vs={};Object.keys(d.versiculos||{}).forEach(n=>{const l=clean(d.versiculos[n],S.b,S.c,+n);if(l.length)vs[n]=l});
    ls.set(key,JSON.stringify({secciones:d.secciones||[],versiculos:vs}));
    if(sig===S.b+':'+S.c){const y=window.scrollY;buildText();window.scrollTo(0,y)}
  }catch(e){}
}
async function showRefs(num){
  const ref=B[S.b][0]+' '+S.c+':'+num;
  openSheet('Referencias de '+ref,'<p class="note">Buscando pasajes relacionados…</p>');
  try{
    const xr=J('xr2:'+S.b+':'+S.c);let l=xr.versiculos&&xr.versiculos[num];
    if(!l){
      const key='vr2:'+S.b+':'+S.c+':'+num,c=ls.get(key);
      if(c)l=JSON.parse(c).referencias;
      else{const d=parse(await groq(SYS,`Da de 4 a 6 pasajes bíblicos relacionados con ${ref}: «${verses[num-1]}». Responde SOLO un JSON {"referencias":[{"ref","nota"}]}; nunca incluyas ese mismo versículo; "ref" con el formato "Libro cap:ver" usando exactamente estos nombres de libro: ${NAMES}; "nota" de una línea que explique la relación.`,true));l=clean(d.referencias,S.b,S.c,num);ls.set(key,JSON.stringify({referencias:l}))}
    }
    $('sb').innerHTML=refList(l)||'<p class="note">No encontré referencias.</p>';
  }catch(er){if(er.message!=='SIN_LLAVE')$('sb').innerHTML=errHtml(er)}
}

/* Subrayar y guardar */
function verseMenu(num){
  const k=vk(S.b,S.c,num),ref=B[S.b][0]+' '+S.c+':'+num,txt=verses[num-1],h=J('bib_hl')[k],bm=!!J('bib_bm')[k];
  const dots=[1,2,3,4].map(i=>`<button class="c${i}${h&&h.c===i?' on':''}" data-c="${i}" aria-label="Resaltar con color ${i}"></button>`).join('');
  openSheet(ref,`<p class="pv" style="font-size:16px;margin:0 0 6px">${esc(txt)}</p><h3>Marcar</h3>
  <div class="colors">${dots}<button class="c5${h&&h.c===5?' on':''}" data-c="5" aria-label="Subrayar">U</button>${h?'<button data-c="0" aria-label="Quitar marca">✕</button>':''}</div>
  <button class="act" id="abm">${bm?'Quitar de “leer después”':'Guardar para leer después'}</button>
  <button class="act" id="axr">Ver referencias</button>
  <button class="act" id="acp">Copiar versículo</button>`);
  document.querySelectorAll('.colors button').forEach(b=>b.onclick=()=>{
    const o=J('bib_hl'),c=+b.dataset.c;if(c)o[k]={c,x:txt.slice(0,90)};else delete o[k];
    ls.set('bib_hl',JSON.stringify(o));buildText();closeSheet();
  });
  $('abm').onclick=()=>{const o=J('bib_bm');if(o[k])delete o[k];else o[k]={t:Date.now(),x:txt.slice(0,90)};ls.set('bib_bm',JSON.stringify(o));buildText();closeSheet()};
  $('axr').onclick=()=>showRefs(num);
  $('acp').onclick=async()=>{try{await navigator.clipboard.writeText(`${txt} — ${ref} (${verLabel()})`);$('acp').textContent='Copiado ✓'}catch(e){$('acp').textContent='No se pudo copiar'}};
}
function openSaved(){
  const bm=J('bib_bm'),hl=J('bib_hl');
  const row=(t,k,x,dot)=>{const [b,c,v]=k.split(':').map(Number);return `<div class="it"><button class="go" data-k="${k}"><b>${B[b][0]} ${c}:${v}</b>${dot||''}<small>${esc(x)}…</small></button><button class="rm" data-k="${k}" data-t="${t}" aria-label="Quitar">✕</button></div>`};
  const a=Object.keys(bm).sort((x,y)=>bm[y].t-bm[x].t).map(k=>row('bm',k,bm[k].x)).join('');
  const key=k=>k.split(':').map(Number),ord=(x,y)=>{const p=key(x),q=key(y);return p[0]-q[0]||p[1]-q[1]||p[2]-q[2]};
  const b=Object.keys(hl).sort(ord).map(k=>row('hl',k,hl[k].x,`<span class="dot h${hl[k].c}"></span>`)).join('');
  openSheet('Guardados',`<h3>Para leer después</h3>${a||'<p class="note">Toca el número de un versículo y elige “Guardar para leer después”.</p>'}<h3>Subrayados y marcados</h3>${b||'<p class="note">Toca el número de un versículo para subrayarlo o resaltarlo.</p>'}`);
}
$('gd').onclick=openSaved;
$('sb').addEventListener('click',e=>{
  const g=e.target.closest('.go'),r=e.target.closest('.rm');
  if(g){const [b,c,v]=g.dataset.k.split(':').map(Number);hist.push({b:S.b,c:S.c,y:window.scrollY,sheet:{t:'Guardados',h:$('sb').innerHTML}});go(b,c,v)}
  else if(r){const n=r.dataset.t==='bm'?'bib_bm':'bib_hl',o=J(n);delete o[r.dataset.k];ls.set(n,JSON.stringify(o));openSaved();buildText()}
});

/* Aviso de actualización */
async function checkUpdate(){
  try{
    const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const m=(await r.text()).match(/const VERSION='(\d[^']*)'/);
    if(m&&m[1]!==VERSION)$('upd').classList.add('on');
  }catch(e){}
}
$('updb').onclick=async()=>{
  try{if(window.caches){for(const k of await caches.keys())await caches.delete(k)}}catch(e){}
  location.replace(location.pathname+'?u='+Date.now());
};
$('updx').onclick=()=>$('upd').classList.remove('on');
let lastChk=0;
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastChk>60000){lastChk=Date.now();checkUpdate()}});
lastChk=Date.now();setTimeout(checkUpdate,1500);

/* Cargar capítulo */
async function load(){
  const [es,en]=B[S.b];
  $('pick').textContent=es+' '+S.c+' ▾';setVer();
  $('text').innerHTML='<p class="msg">Cargando…</p>';
  ls.set('bib_pos',JSON.stringify({b:S.b,c:S.c}));
  try{
    verses=await chapterVerses(S.b,S.c);
    buildText();
    if(S.v){const el=document.querySelector(`.v[data-v="${S.v}"]`);if(el)el.scrollIntoView({block:'center'})}
    else window.scrollTo(0,0);
    loadXr();
  }catch(e){
    $('text').innerHTML='<p class="msg">No se pudo cargar el capítulo.<br>Detalle: '+esc(e.message==='Failed to fetch'?'el navegador bloqueó o no alcanzó la conexión':e.message)+'<br><br><button class="save" style="width:auto;padding:10px 22px" onclick="load()">Reintentar</button></p>';
  }
}
function go(b,c,v){S={b,c,v:v||null};closeSheet();upBack();return load()}
let EN=B.map(b=>b[1]);
load();

/* Navegación */
$('prev').onclick=()=>{if(S.c>1)go(S.b,S.c-1);else if(S.b>0)go(S.b-1,B[S.b-1][2])};
$('next').onclick=()=>{if(S.c<B[S.b][2])go(S.b,S.c+1);else if(S.b<65)go(S.b+1,1)};
$('pick').onclick=()=>{
  const opts=B.map((b,i)=>`<option value="${i}"${i===S.b?' selected':''}>${b[0]}</option>`).join('');
  openSheet('Elegir pasaje',`<select id="selb" aria-label="Libro">${opts}</select><div class="grid" id="grid"></div>`);
  const draw=()=>{const b=+$('selb').value;$('grid').innerHTML=Array.from({length:B[b][2]},(_,i)=>`<button data-c="${i+1}" class="${b===S.b&&i+1===S.c?'cur':''}">${i+1}</button>`).join('')};
  draw();$('selb').onchange=draw;
  $('grid').onclick=e=>{const c=e.target.dataset.c;if(c)go(+$('selb').value,+c)};
};

/* Ajustes */
const FONTS={'Literata':"'Literata',Georgia,serif",'Georgia':"Georgia,serif",'Sin serifa':"system-ui,-apple-system,'Segoe UI',sans-serif",'Verdana':"Verdana,Geneva,sans-serif"};
function applyFont(){
  const r=document.documentElement.style;
  r.setProperty('--rf',FONTS[ls.get('bib_font')]||FONTS.Literata);
  r.setProperty('--rs',(ls.get('bib_size')||'19')+'px');
}
applyFont();
function settings(msg){
  const f=ls.get('bib_font')||'Literata',imp=ls.get('bib_src')==='import';
  openSheet('Ajustes',`<h3>Letra</h3><select id="ff" aria-label="Tipo de letra">${Object.keys(FONTS).map(k=>`<option${k===f?' selected':''}>${k}</option>`).join('')}</select>
  <div class="row" style="margin-top:10px"><button id="fm" aria-label="Letra más chica">A−</button><button id="fp" aria-label="Letra más grande">A+</button></div>
  <p class="pv" style="margin:14px 0 0">EN el principio crió Dios los cielos y la tierra.</p>
  <h3>Versión</h3><p class="note">Estás leyendo: ${imp?esc(ls.get('bib_imp_name')||'tu Biblia importada'):'Reina-Valera 1909 (en línea)'}.</p>
  <button class="act" id="imp">Importar mi Biblia (archivo)</button>${hasImp()?'<button class="act" id="imq">Borrar la Biblia importada</button>':''}
  <input type="file" id="fil" accept=".json,.txt,.csv,text/plain,application/json" hidden>
  <p class="note" id="impmsg">Acepta .json (libros con capítulos, o versículos sueltos) o .txt/.csv con líneas como “Juan 3:16 Porque de tal manera…”. El texto se guarda solo en este dispositivo.</p>
  <h3>En el texto</h3><label class="note" style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="xrt" style="width:auto"${ls.get('bib_xr')==='0'?'':' checked'}>Mostrar títulos y flechas ↗ de referencias (usa la IA)</label>
  <h3>Llave de Groq</h3><p class="note">${esc(msg||'La llave se guarda solo en este navegador.')}</p>
  <input id="key" type="password" placeholder="Llave de Groq (gsk_…)" autocomplete="off" value="${esc(ls.get('bib_key')||'')}"><button class="save" id="sk">Guardar llave</button>
  `);
  $('imp').onclick=()=>$('fil').click();
  $('fil').onchange=async()=>{
    const f=$('fil').files[0];if(!f)return;
    $('impmsg').textContent='Leyendo el archivo…';
    try{
      const r=parseBible(await f.text());
      if(r.verses<100)throw new Error('no encontré versículos en un formato que entienda.');
      await idbSet(r.map);ls.set('bib_src','import');ls.set('bib_imp','1');ls.set('bib_imp_name',/1960|rvr60/i.test(f.name)?'RVR1960':'Mi Biblia');setVer();
      $('impmsg').textContent=`Listo: ${r.books} de 66 libros y ${r.verses} versículos.${r.books<66?' Los libros que faltan no cargarán.':''}`;
      load();
    }catch(e){$('impmsg').textContent='No pude importar ese archivo: '+e.message}
  };
  if($('imq'))$('imq').onclick=async()=>{await idbClear().catch(()=>{});ls.set('bib_src','online');ls.set('bib_imp','0');ls.set('bib_imp_name','');setVer();closeSheet();load()};
  $('xrt').onchange=()=>{ls.set('bib_xr',$('xrt').checked?'1':'0');buildText();loadXr()};
  $('ff').onchange=()=>{ls.set('bib_font',$('ff').value);applyFont()};
  const sz=d=>{ls.set('bib_size',String(Math.max(14,Math.min(34,+(ls.get('bib_size')||19)+d))));applyFont()};
  $('fm').onclick=()=>sz(-2);$('fp').onclick=()=>sz(2);
  $('sk').onclick=()=>{ls.set('bib_key',$('key').value.trim());closeSheet()};
}
$('cfg').onclick=()=>settings();

/* Contexto del capítulo */
$('ctx').onclick=async()=>{
  const [es]=B[S.b],ref=es+' '+S.c,key='ctx:'+S.b+':'+S.c;
  openSheet('Contexto de '+ref,'<p class="note">Preparando el contexto…</p>');
  try{
    let d;const cached=ls.get(key);
    if(cached)d=JSON.parse(cached);
    else{
      const raw=await groq(SYS,`Dame el contexto de ${ref} para entenderlo mejor. Responde SOLO un JSON con estas claves: "autor" (quién escribió el libro, quién era y en qué situación vivía; si hay debate, dilo), "epoca" (cuándo y desde dónde se escribió), "destinatarios" (a quién iba dirigido y por qué lo escribió), "tema_libro" (idea central del libro y cómo encaja en la Biblia), "contexto_capitulo" (qué pasa antes y después, y qué quiere enseñar este capítulo, en 3 a 5 oraciones), "ideas" (lista de 3 a 5 ideas clave del capítulo), "costumbres" (lista de 0 a 4 costumbres, lugares o palabras de esa época que ayudan a entender el pasaje), "referencias" (lista de 4 a 6 objetos {"ref","nota"} con pasajes relacionados; "ref" con el formato "Libro cap:ver" usando exactamente estos nombres de libro: ${NAMES}; "nota" de una línea que explique la relación).`,true);
      d=parse(raw);ls.set(key,JSON.stringify(d));
    }
    const li=a=>(a&&a.length)?`<ul>${a.map(x=>`<li>${L(x)}</li>`).join('')}</ul>`:'';
    openSheet('Contexto de '+ref,
      `<h3>Quién lo escribió</h3><p>${L(d.autor)}</p>
       <h3>Cuándo y dónde</h3><p>${L(d.epoca)}</p>
       <h3>A quién se lo escribió</h3><p>${L(d.destinatarios)}</p>
       <h3>Tema del libro</h3><p>${L(d.tema_libro)}</p>
       <h3>Este capítulo</h3><p>${L(d.contexto_capitulo)}</p>${li(d.ideas)}
       ${d.costumbres&&d.costumbres.length?'<h3>Para entender la época</h3>'+li(d.costumbres):''}
       <h3>Referencias relacionadas</h3>${refList(d.referencias)}`);
  }catch(e){if(e.message!=='SIN_LLAVE')$('sb').innerHTML=errHtml(e)}
};

/* Palabra y versículo tocables */
$('text').addEventListener('click',async e=>{
  const w=e.target.closest('.w'),n=e.target.closest('.n'),x=e.target.closest('.x');
  if(w){
    const v=w.closest('.v'),num=+v.dataset.v,word=w.textContent,key=`w:${norm(word)}:${S.b}:${S.c}:${num}`;
    document.querySelectorAll('.w.on').forEach(x=>x.classList.remove('on'));w.classList.add('on');
    openSheet(word,'<p class="note">Buscando el significado…</p>');
    try{
      let t=ls.get(key);
      if(!t){t=await groq(SYS,`Explica la palabra «${word}» tal como se usa en ${B[S.b][0]} ${S.c}:${num} (Reina-Valera): «${verses[num-1]}». En 2 a 4 líneas: qué significa hoy en palabras sencillas y, solo si ayuda, la palabra original en griego o hebreo con su sentido. Sin títulos ni listas.`,false);ls.set(key,t)}
      $('sb').innerHTML=`<p>${esc(t.trim()).replace(/\n+/g,'</p><p>')}</p>`;
    }catch(er){if(er.message!=='SIN_LLAVE')$('sb').innerHTML=errHtml(er)}
  }else if(n){verseMenu(+n.closest('.v').dataset.v)}
  else if(x){showRefs(+x.closest('.v').dataset.v)}
});
</script>
</body>
